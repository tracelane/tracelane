# cargo-audit configuration
# See: https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
# rustls-webpki 0.102.x CVEs — these are pulled in transitively by async-nats 0.38.
# async-nats 0.38 requires webpki 0.102.x; upgrade to async-nats >=0.47 will fix this.
# (we don't expose CRL parsing to untrusted external input — our NATS server URL
# is operator-controlled via NATS_URL env var, not user-supplied).
#
# wasmtime 20.0.x — 17 RUSTSEC advisories. The wasm-plugin feature is OFF by
# default (crates/gateway/Cargo.toml:107 — `wasm-plugin = ["dep:wasmtime"]`)
# and is not enabled in any V1 ship binary. The wasm_plugin module is
# `#![cfg(feature = "wasm-plugin")]` so it does not compile into the default
ignore = [
    "RUSTSEC-2026-0104",  # rustls-webpki: reachable panic in CRL parsing
    "RUSTSEC-2026-0049",  # rustls-webpki: vulnerability
    "RUSTSEC-2026-0098",  # rustls-webpki: vulnerability
    "RUSTSEC-2026-0099",  # rustls-webpki: vulnerability
    "RUSTSEC-2025-0134",  # rustls-pemfile: informational/deprecated warning
    "RUSTSEC-2024-0438",  # wasmtime
    "RUSTSEC-2024-0439",  # wasmtime
    "RUSTSEC-2025-0046",  # wasmtime
    "RUSTSEC-2025-0118",  # wasmtime: unsound API access to shared linear memory
    "RUSTSEC-2026-0020",  # wasmtime: guest-controlled resource exhaustion in WASI
    "RUSTSEC-2026-0021",  # wasmtime
    "RUSTSEC-2026-0085",  # wasmtime: panic when lifting flags component value
    "RUSTSEC-2026-0086",  # wasmtime
    "RUSTSEC-2026-0087",  # wasmtime
    "RUSTSEC-2026-0088",  # wasmtime: data leakage between pooling allocator instances
    "RUSTSEC-2026-0089",  # wasmtime
    "RUSTSEC-2026-0091",  # wasmtime: OOB write/crash when transcoding component strings
    "RUSTSEC-2026-0092",  # wasmtime
    "RUSTSEC-2026-0093",  # wasmtime
    "RUSTSEC-2026-0094",  # wasmtime: improperly masked return value from table.grow (Winch)
    "RUSTSEC-2026-0095",  # wasmtime
    "RUSTSEC-2026-0096",  # wasmtime
    # Transitive UNMAINTAINED advisories (informational, not reachable RCEs) —
    # `cargo audit --deny warnings` fails on warning-level entries. Both crates
    # are pulled in transitively, not depended on directly. Revisit if either
    # is superseded by a code-execution advisory.
    "RUSTSEC-2024-0436",  # paste: unmaintained proc-macro (no fix; ubiquitous transitive dep)
    "RUSTSEC-2025-0141",  # bincode 1.3.3: 1.x unmaintained (2.0 is a transitive-incompatible major bump)
]
