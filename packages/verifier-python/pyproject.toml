[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracelane-audit-verifier"
version = "0.2.1"
description = "Reference verifier for Tracelane tamper-evident audit ledgers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tracelane Contributors" }]
classifiers = [
 "Development Status :: 4 - Beta",
 "Intended Audience :: Developers",
 "License :: OSI Approved :: Apache Software License",
 "Programming Language :: Python :: 3.10",
 "Programming Language :: Python :: 3.11",
 "Programming Language :: Python :: 3.12",
]
dependencies = [
 "cryptography>=42",
]

[project.urls]
Homepage = "https://tracelane.dev"
Repository = "https://github.com/tracelane/tracelane"
Documentation = "https://docs.tracelane.dev"
Issues = "https://github.com/tracelane/tracelane/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/tracelane_audit_verifier"]

[tool.ruff]
line-length = 100
target-version = "py310"
