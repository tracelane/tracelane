# Grype configuration for the Container/filesystem scan (security-scan.yml).
#
# The repo is Rust + TypeScript + Python. It ships NO Go. Every HIGH/Critical
# Grype finding is in `stdlib` (the Go standard library) embedded in the
# vendored **esbuild** binary (node_modules/.pnpm/esbuild@*) — a build-time
# bundler used by vitest/tsup, never shipped in any product artifact. The Go
# net/http2/crypto CVEs it carries are unreachable in our context.
#
# We therefore ignore Go-module findings (justified, auditable) and exclude
# build/dev artifact trees from the scan. Cargo and npm dependency CVEs are
# still covered by cargo-audit / cargo-deny / pnpm-audit / OSV-Scanner.
#
# ⚠️ SCHEMA NOTE (fixed 2026-07-06): each ignore rule below is a
# PACKAGE-ONLY matcher — do NOT add `vulnerability: "*"`. Grype treats the
# `vulnerability` field as a LITERAL vuln-id comparison, so `"*"` matches a vuln
# *named* "*" (i.e. nothing), silently disabling the rule (grype loads the
# config fine — verified via `-vv` config dump — but matched nothing). Omitting
# `vulnerability` ignores ALL vulns for the matched package. The CI step passes
# this file with `--config .grype.yaml` (v0.112 does not auto-discover it).

ignore:
  # All Go stdlib CVEs come from the vendored esbuild dev-tool binary.
  # REVIEW: 2026-11-07
  - package:
      type: go-module
  # rustls-webpki 0.102.x — transitive via async-nats 0.42 (NATS URL is
  # operator-controlled, not untrusted input; CRL-parse path unreachable).
  # Same posture as .cargo/audit.toml (RUSTSEC-2026-0049/0098/0099/0104) +
  # osv-scanner.toml; real fix = the async-nats >=0.47 upgrade. By-name (not a
  # single GHSA) because Grype reports several webpki advisories under aliases
  # that don't match the RUSTSEC/OSV ids the other scanners list.
  # REVIEW: 2026-11-07
  - package:
      name: rustls-webpki
  # vite / vitest — dev/test tooling only (vitest), never shipped in any product
  # artifact. Grype catalogs them from pnpm-lock.yaml (not just node_modules),
  # so the exclude below is insufficient — the ignore is what suppresses them.
  # Mirrors osv-scanner.toml; tied to the vitest-major migration.
  # REVIEW: 2026-11-07
  - package:
      name: vite
  # REVIEW: 2026-11-07
  - package:
      name: vitest
  # brace-expansion 2.1.4 — the one residual of the 2026-07-30 bump pass (postcss,
  # valibot and the brace-expansion 5.x copy were all raised to fixed versions, not
  # ignored). 2.1.4 carries the backported CVE-2026-14257 fix (EXPANSION_MAX_LENGTH),
  # but the GHSA range is a flat `<= 5.0.7` — not branch-aware — so it keeps matching
  # every 2.x maintenance release. Cannot raise to 5.x: minimatch@8.0.7 consumes the
  # callable default export that 5.x replaced with a named one. Build-only chain
  # (@opennextjs/aws -> @node-minify/core@8 -> glob@9 -> minimatch@8); never shipped.
  # This rule names the ADVISORY as well as the package (unlike the package-only rules
  # above) so any OTHER brace-expansion advisory still fires. The genuinely vulnerable
  # 2.1.2 cannot return: pnpm overrides floor the 2.x line at >=2.1.4 and the >=3 line
  # at >=5.0.8. Mirrors osv-scanner.toml + package.json auditConfig.ignoreGhsas.
  # REVIEW: 2026-11-07
  - vulnerability: GHSA-mh99-v99m-4gvg
    package:
      name: brace-expansion
  # ── ADDED 2026-08-09 (founder-ruled). These three were ALREADY accepted in
  # osv-scanner.toml and were MISSING here, so Grype re-flagged advisories OSV had
  # passed. Two suppression lists for one decision, drifted — same class as
  # (BYOK routable-vs-storable) and the 6-way alert-metric list.

  # opentelemetry_sdk 0.27.1 — SUPPRESSED, not fixed.
  # Reason it does not apply: it is not a dependency we chose. `cargo tree --invert`
  # shows it arrives ONLY via opentelemetry-proto (the OTLP protobuf decoder in
  # crates/ingest). We consume prost-generated structs; no SDK entry point is ever
  # called. Verified 2026-08-09 that `default-features = false` on opentelemetry-proto
  # compiles clean but does NOT drop the crate — the sdk is required by the `trace`
  # feature. The only real fix is opentelemetry-proto 0.27 -> ~0.32, a five-minor jump
  # on the decoder in the ingest hot path, to patch code we never execute.
  # UNBLOCKING CONDITION: bump when opentelemetry-proto is upgraded for another reason.
  # REVIEW: 2026-11-07
  - vulnerability: GHSA-w9wp-h8wv-79jx
    package:
      name: opentelemetry_sdk

  # @hono/node-server 1.19.14 — SUPPRESSED, not fixed.
  # Reason it does not apply: purely transitive (via the MCP SDK), patched only in the
  # 2.x MAJOR. Forcing a major on a transitive dep we do not control, in an app whose
  # tests would not catch a runtime break, is a worse risk than the moderate itself.
  # UNBLOCKING CONDITION (founder, 2026-08-09): revisit when apps/mcp has real test
  # coverage — until then a forced major is unverifiable.
  # REVIEW: 2026-11-07
  - vulnerability: GHSA-frvp-7c67-39w9
    package:
      name: "@hono/node-server"

  # esbuild (0.18.20 / 0.19.12 / 0.21.5 / 0.27.7) — SUPPRESSED, not fixed.
  # Reason it does not apply: BOTH advisories require the esbuild DEV SERVER
  # (`esbuild --serve`), which this repo never runs. Every affected copy is build
  # tooling only — drizzle-kit, @opennextjs/aws, bundle-require, esbuild-register,
  # @esbuild-kit/core-utils — and esbuild is never shipped in a product artifact.
  # An override to 0.25.0 would drag four build tools off their pinned majors to patch
  # a code path we do not execute.
  # UNBLOCKING CONDITION: drops out naturally as those tools upgrade their pins.
  # REVIEW: 2026-11-07
  - vulnerability: GHSA-67mh-4wv8-2f99
    package:
      name: esbuild
  # REVIEW: 2026-11-07
  - vulnerability: GHSA-g7r4-m6w7-qqqr
    package:
      name: esbuild


exclude:
  - "./target/**"
  - "./**/node_modules/**"
  - "./.git/**"

# Keep the high cutoff the CI step sets (--fail-on high).
fail-on-severity: high
