# ── astro 6.4.8, surfaced by the weekly on-node scan (R118 alert, 2026-08-24) ──
#
# THREE ADVISORIES, ALL SSR-ONLY, AND WE SHIP A PURELY STATIC SITE. Each one was
# READ at osv.dev rather than taken from a note, and each says in its own text
# that a static build is unaffected:
#
#   GHSA-4g3v-8h47-v7g6 (5.3) — reflected XSS via unescaped View Transition
#     animation properties in server-generated CSS
#     (`runtime/server/transition.ts`). Advisory scopes it to `output: "server"`
#     and `prerender = false` routes.
#   GHSA-f48w-9m4c-m7f5 (5.1) — unescaped attribute NAMES in `renderHTMLElement()`
#     (`runtime/server/render/dom.ts`). Needs an SSR runtime that exposes a global
#     `HTMLElement` (Deno/Bun/jsdom); in default Node SSR the branch is dead.
#   GHSA-7pw4-f3q4-r2p2 (2.1) — reflected XSS through `transition:persist` /
#     `transition:scope` values copied unescaped into server-rendered output by
#     `generateHydrateScript()`.
#
# THE CONDITION THAT MAKES THESE UNREACHABLE, stated so it can be RE-CHECKED
# rather than believed: `apps/site/astro.config.mjs` declares NO adapter and no
# `output: "server"`, so Astro defaults to `output: "static"`; `apps/site/dist/`
# contains no server entry. There is no SSR runtime to reach any of the three
# code paths.
#
# ⚠️  DELETE THESE THREE THE DAY `apps/site` GAINS AN ADAPTER OR `output:
# "server"`. That single change makes all three live, and this ignore would then
# be an ignore whose reason has gone false — which this file's own header calls
# worse than an unused one.
#
# The real fix is astro 6 -> 7 (a major). Not taken for a static marketing site
# against three Medium/Low advisories that cannot execute.
# REVIEW: 2026-11-07
[[IgnoredVulns]]
id = "GHSA-4g3v-8h47-v7g6"
reason = "astro View-Transition CSS XSS. SSR-ONLY: the advisory scopes it to `output: \"server\"` / `prerender = false`. `apps/site` has NO adapter and no `output: \"server\"` (astro.config.mjs), so it builds static and `dist/` has no server entry — the code path cannot run. DELETE THIS IGNORE if apps/site ever gains an adapter. Fix is astro 7.1.0 (major)."

# REVIEW: 2026-11-07
[[IgnoredVulns]]
id = "GHSA-f48w-9m4c-m7f5"
reason = "astro `renderHTMLElement()` unescaped attribute names. SSR-ONLY, and doubly unreachable: it needs an SSR runtime exposing a global `HTMLElement` (Deno/Bun/jsdom) — in default Node SSR the branch is dead — plus a component extending native HTMLElement with attacker-controlled spread keys. `apps/site` is a static build with no adapter, so there is no SSR runtime at all. DELETE THIS IGNORE if apps/site ever gains an adapter. Fix is astro 7.0.6 (major)."

