# osv-scanner.toml — ignore list for OSV-Scanner (security-scan.yml).
#
# OSV-Scanner fails on ANY advisory across BOTH ecosystems with no severity
# gate and does not read .cargo/audit.toml, so it re-surfaces advisories that
# cargo-audit / pnpm-audit already justify. Each ignore below is the SAME
# posture as those tools. The one genuinely actionable finding OSV raised —
# jsonwebtoken GHSA-h395-gr6q-cpjc — was FIXED by bumping to 10.4.0,
# not ignored. npm moderates are below the pnpm-audit --audit-level=high gate
# and tracked internally.
#
# Every entry carries a `# REVIEW:` date, enforced by
# scripts/ci/check-suppression-reviews.py. A date says when the entry must next be
# re-read; it does not prove the reason still holds. An ignore whose stated reason has
# gone false is worse than an unused one — correct or delete it.

# vite GHSA-fx2h-pf6j-xcff / GHSA-v6wh-96g9-6wx3 / GHSA-4w7w-66w2-5vf9 and vitest GHSA-5xrq-8626-4rwp:
# mutes REMOVED 2026-10-03 — vitest 3.2.7 (fixed >=3.2.6) with vite 7.3.6 (package.json overrides
# vitest>vite / vite-node>vite); the lockfile no longer resolves a vulnerable version of either.
# opentelemetry_sdk (Rust 0.27.1): transitive OTel Rust SDK moderate; not a reachable RCE. Tracked with the OTel-Rust bump.
# REVIEW: 2026-11-07
[[IgnoredVulns]]
id = "GHSA-w9wp-h8wv-79jx"
reason = "opentelemetry_sdk 0.27.x transitive moderate (OTel Rust SDK); not a reachable RCE; tracked with the OTel-Rust upgrade."

