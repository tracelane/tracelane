# vitest advisory (CVE-2026-84373): path traversal via a redirect mock, reachable ONLY
# through the unauthenticated `mockerPlugin`/`interceptorPlugin` of a Vite DEV SERVER or
# vitest browser mode. Neither is used anywhere in the tree; every invocation is
# `vitest run`. Fix version is 4.1.11 (a major; vitest 4 broke 115 apps/web files, 2026-10-03).
# Mirrored in .grype.yaml (`@vitest/mocker`; `vitest` by package).
# REVIEW: 2026-11-07
[[IgnoredVulns]]
id = "GHSA-82fw-gwwq-j7x9"
reason = "vitest/@vitest/mocker 3.2.7 redirect-mock path traversal: needs a Vite dev server or vitest browser mode; we run `vitest run` only, never shipped. Fix is 4.1.11 (major, breaks apps/web JSX parse)."

