# osv-scanner.toml — ignore list for OSV-Scanner (security-scan.yml).
#
# OSV-Scanner fails on ANY advisory across BOTH ecosystems with no severity
# gate and does not read .cargo/audit.toml, so it re-surfaces advisories that
# cargo-audit / pnpm-audit already justify. Each ignore below is the SAME
# posture as those tools. The one genuinely actionable finding OSV raised —
# jsonwebtoken GHSA-h395-gr6q-cpjc — was FIXED by bumping to 10.4.0,
# not ignored. npm moderates are below the pnpm-audit --audit-level=high gate
# and tracked internally.
#
# ── ON `# REVIEW:` DATES — READ BEFORE TRUSTING ONE ─────────────────────────
# Every remaining entry carries the SAME bulk-stamped `# REVIEW: 2026-11-07`.
# An identical date on every row carries NO PER-ENTRY INFORMATION: it records
# when someone stamped the file, not when anyone re-read THIS justification.
# That is the same defect as a file-level "last verified" stamp standing in for
# a row-level re-read. Two entries were found on 2026-08-24 whose REASON had
# gone false while the entry still fired and therefore still looked healthy
# (@hono/node-server — fixed on our own 1.x line all along, now bumped and the
# ignore deleted; and vitest — right conclusion, wrong version arithmetic, text
# corrected below). AN IGNORE WHOSE REASON HAS GONE FALSE IS WORSE THAN AN
# UNUSED ONE: it is a decision nobody will re-open. No guard checks this; it is
# a human re-read, and the date above will not tell you when one last happened.
#
# 19 dead ignores were deleted 2026-08-24 (osv-scanner 2.4.0 reported each as
# unused): 4 whose package is gone, 10 bumped past the fix, 4 alias-redundant
# with the GHSA half already listed, and @hono/node-server once bumped.

