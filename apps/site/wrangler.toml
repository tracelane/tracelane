# Cloudflare Workers config for tracelane-site (static assets + D1).
#
# ⚠️ THE WORKER NAME IS THE ONE SERVING tracelane.dev. A `wrangler deploy` from here
# REPLACES the live site.
#
# THE CUTOVER HAS RUN — 2026-08-18, founder-authorised, worker version
# 33dc495b-006a-4474-99c4-d70dd01a0331. tracelane.dev is served by THIS directory now.
# Verified after: 8/8 fresh edge requests on the new build, all 6 routes 200,
# /pricing rendering 6 tiers.
#
# `tracelane/site` IS ARCHIVED AND MUST NEVER BE USED (founder, 2026-08-18) — confirmed
# `isArchived: true` via `gh repo view`, which makes it read-only at GitHub's end, so a
# push there is rejected by the server rather than by our discipline. This repo has no
# remote pointing at it. The old warning here said the cutover "has NOT been run" and
# that the archived repo would keep "looking like it is" deployed; both premises are
# now false, and a deploy config that misstates what is live is exactly the kind of
# stale note that gets someone to deploy the wrong thing.
#
# Deploy through `scripts/deploy/site.sh`, never a bare `wrangler deploy` — the bare
# command is what published a six-commits-behind working copy over the live site on
# 2026-07-29 and silently reverted every honesty fix in it.

name = "tracelane-site"
compatibility_date = "2026-05-20"
main = "functions/api/notify.ts"

[assets]
directory = "./dist"
# Required for `env.ASSETS` to exist in the Worker. Without it the binding is
# undefined and every asset-miss path throws (CF 1101) instead of 404ing.
# `not_found_handling` is deliberately NOT set: it would make the asset handler
# answer misses itself, and POST /api/notify is an asset miss.
binding = "ASSETS"

# D1 binding for /api/notify
[[d1_databases]]
binding = "DB"
database_name = "tracelane-notify"
database_id = "8a8128d8-451c-43df-ad91-f0a9c7c70a70"
migrations_dir = "migrations"
