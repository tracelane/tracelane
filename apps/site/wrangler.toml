# Cloudflare Workers config for tracelane-site (static assets + D1).
#
# ⚠️ THE WORKER NAME IS THE ONE CURRENTLY SERVING tracelane.dev. A `wrangler deploy`
# from here REPLACES the live site — that is the cutover, and it has NOT been run.
# ADR-074 §10 was authorised as a build; the cutover is a separate founder call, and it
# is irreversible in the sense that matters: the moment it lands, the tracelane/site repo
# stops being the thing that is deployed while still looking like it is.
#
# Deploy through `scripts/deploy/site.sh`, never a bare `wrangler deploy` — the bare
# command is what published a six-commits-behind working copy over the live site on
# 2026-07-29 and silently reverted every honesty fix in it.

name = "tracelane-site"
compatibility_date = "2026-05-20"
main = "functions/api/notify.ts"

[assets]
directory = "./dist"
# Required for `env.ASSETS` to exist in the Worker. Without it the binding is
# undefined and every asset-miss path throws (CF 1101) instead of 404ing.
# `not_found_handling` is deliberately NOT set: it would make the asset handler
# answer misses itself, and POST /api/notify is an asset miss.
binding = "ASSETS"

# D1 binding for /api/notify
[[d1_databases]]
binding = "DB"
database_name = "tracelane-notify"
database_id = "8a8128d8-451c-43df-ad91-f0a9c7c70a70"
migrations_dir = "migrations"
