# ── PRIVATE-MINUTE POLICY (2026-08-01) ────────────────────────────────
# Public Actions are unlimited and free; private are capped at 2,000 min/month
# and exhausted mid-cycle twice (June, July). These workflow FILES
# are shared — the public repo is built from this tree — so the trigger list
# cannot be edited to cut private cost without also disabling the PUBLIC run,
# which is now the only always-on gate. The split is therefore a job-level
# repository condition, which exports unchanged and evaluates true on public.
# CodeQL — static analysis for the three languages in this repo.
#
# Free on public repositories; results land in the Security tab and are one of
# the signals reviewers and OpenSSF Scorecard look for.
#
# All actions are SHA-pinned per CLAUDE.md ("All GitHub Actions SHA-pinned,
# never tag-pinned"). To bump: resolve the tag to a commit SHA and update the
# comment beside it — never replace a SHA with a tag.
#
# build-mode `none` is used for all three languages: CodeQL analyses source
# directly without invoking cargo/tsc, which keeps this job independent of the
# workspace build. That matters here because a compile failure would otherwise
# turn a security scan into a build gate and mask real findings.
#
# ── HOSTED-RUNNER OPT-IN, 2026-09-07 (founder ruling on hosted-runner cost) ──
# `push` / `pull_request` / `schedule` are ALL REMOVED. `workflow_dispatch` with
# an explicit `hosted_runners: approved-by-founder` input is now the ONLY
# trigger that reaches the job — this is the heaviest hosted job in the whole
# repo bar `bench`/`live-eval-gate` (3 languages x matrix, `security-extended`
# queries, up to 45 minutes), and CodeQL's own autobuild has no self-hosted
# story worth trusting on a box that also serves prod.
#   gh workflow run CodeQL --ref main -f hosted_runners=approved-by-founder
# NOTED, NOT THE REASON FOR THIS CHANGE: `if: github.repository ==
# 'tracelane/tracelane'` below already made this job PUBLIC-ONLY, and every
# `push`/`pull_request`/`schedule` firing on the PRIVATE repo already concluded
# `skipped` (`gh api .../workflows/codeql.yml/runs` — verified, zero billable
# minutes there today). The real effect of this change is on the PUBLIC repo:
# CodeQL no longer scans automatically on every push/PR or weekly — only when
# someone deliberately dispatches it with approval. That is a genuine reduction
# in continuous public scanning coverage, worth knowing even though it costs
# nothing extra here.
name: CodeQL

on:
  workflow_dispatch:
    inputs:
      hosted_runners:
        description: >-
          Run CodeQL (3-language matrix, up to 45 min, GitHub-hosted)? Founder
          approval only (2026-09-07). Leave "no" to no-op this workflow.
        type: choice
        options:
          - "no"
          - "approved-by-founder"
        default: "no"

permissions:
  contents: read

jobs:
  analyze:
    # PUBLIC-ONLY (same code; apps/web/e2e and scripts/export are private-only
    # and go unscanned) AND NOW ALSO FOUNDER-APPROVED-DISPATCH-ONLY (see header).
    if: >-
      github.repository == 'tracelane/tracelane'
      && github.event_name == 'workflow_dispatch'
      && inputs.hosted_runners == 'approved-by-founder'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write # required to upload SARIF to the Security tab
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          category: "/language:${{ matrix.language }}"
