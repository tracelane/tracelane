# CodeQL — static analysis for the three languages in this repo.
#
# Free on public repositories; results land in the Security tab and are one of
# the signals reviewers and OpenSSF Scorecard look for.
#
# All actions are SHA-pinned per CLAUDE.md ("All GitHub Actions SHA-pinned,
# never tag-pinned"). To bump: resolve the tag to a commit SHA and update the
# comment beside it — never replace a SHA with a tag.
#
# build-mode `none` is used for all three languages: CodeQL analyses source
# directly without invoking cargo/tsc, which keeps this job independent of the
# workspace build. That matters here because a compile failure would otherwise
# turn a security scan into a build gate and mask real findings.
name: CodeQL

on:
  # Path filter is `paths-ignore`, NOT `paths`, and that direction is deliberate:
  # this is a security scanner, so the default must be SCAN and the exception
  # must be an explicit, enumerated skip. An allowlist would silently stop
  # scanning the first time someone adds a source directory nobody remembered to
  # list — the scanner would go quiet and look healthy. Everything below is a
  # tracker, a runbook, or prose that CodeQL does not analyse in any case.
  #
  # Costs 5 billable job-minutes a run (rust 2 + js/ts 2 + python 1), and a large
  # share of pushes here touch documentation only, so this is real spend against
  # a finite monthly Actions allowance rather than a tidy-up.
  # The weekly `schedule` below is intentionally NOT filtered: it runs regardless
  # so a newly-published query still reaches existing code.
  push:
    branches: [main]
    # Filter by TYPE, not by filename. CodeQL analyses rust / javascript-typescript
    # / python — it cannot analyse Markdown at all, so "no .md or .mdx" is both
    # complete and exact. Filtering by type also names nothing: an enumerated list
    # of internal document filenames would leak the private doc taxonomy into a
    # file that ships publicly, and the export leak-guard correctly blocks that.
    paths-ignore: &prose
      - "**/*.md"
      - "**/*.mdx"
  pull_request:
    branches: [main]
    paths-ignore: *prose
  schedule:
    # Weekly, so a newly-published query catches existing code without a push.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write # required to upload SARIF to the Security tab
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          category: "/language:${{ matrix.language }}"
