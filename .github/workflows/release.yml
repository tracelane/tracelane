name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # BUILD-ONLY dry run. This workflow was tag-triggered ONLY, so the sole way to
  # exercise it was to cut a real signed tag — which is why six release tags were
  # burned debugging a single linker flag while it stayed red.
  # Dispatch runs the compile/link matrix and nothing else: every publishing job
  # below is gated on `refs/tags/`, and the crypto gate is untouched on the tag
  # path (see verify-signed-tag).
  workflow_dispatch:

# Least privilege at the top; every write is granted at the JOB that needs it.
# Top-level `contents: write` handed release-creating scope to EVERY job in this
# file — including verify-signed-tag and the four build-rust matrix jobs, which
# only read. Verified per job before narrowing (Scorecard TokenPermissionsID,
# release.yml:9):
#   verify-signed-tag / build-rust  -> read (checkout, build, upload-artifact)
#   sign-and-release                -> contents:write (creates the Release)
#                                    + id-token:write (cosign sign-blob keyless)
#   slsa-provenance / slsa-framework-generator / publish-* -> declare their own
permissions:
  contents: read

jobs:
  verify-signed-tag:
    name: Verify release tag is signed
    runs-on: ubuntu-latest
    # Only meaningful on a tag ref. On `workflow_dispatch` this job SKIPS, which
    # is what keeps a dry run from publishing: every publish-* job `needs:` this
    # one, and a skipped need skips the dependant. The tag path is unchanged —
    # the cryptographic gate below still runs and still fails closed.
    if: startsWith(github.ref, 'refs/tags/')
    # The release gate is CRYPTOGRAPHIC, not human — and it is ENFORCED HERE, in this
    # job, NOT by a ruleset. (GitHub's `required_signatures` ruleset rule is
    # commit-oriented and was empirically proven NOT to block unsigned tags — via API
    # and via `git push` — so it is deliberately not relied on.) This job runs
    # `git verify-tag` against the maintainer's PINNED public key and FAILS CLOSED;
    # every publish job `needs:` it (publish-* -> sign-and-release -> build-rust ->
    # verify-signed-tag), so an unsigned / lightweight / wrong-key tag can trigger the
    # workflow but can NEVER reach a publish. The signing key is held offline on the
    # maintainer's machine — never in CI or on the node. `production-release` is kept
    # as a 0-reviewer environment (branch policy v*/main only) — deliberately NO manual
    # approval step. Residual: an attacker who can also rewrite this workflow (full
    # main-write compromise) bypasses it — mitigated by 2FA + credential hygiene, not
    # here. Required repo setup: set the `RELEASE_TAG_ALLOWED_SIGNERS` repo variable
    # to the maintainer's SSH signing pubkey line (`<git-user-email> ssh-ed25519 AAAA…`).
    environment:
      name: production-release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Verify the release tag carries the trusted maintainer signature
        env:
          ALLOWED_SIGNERS: ${{ vars.RELEASE_TAG_ALLOWED_SIGNERS }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ -z "${ALLOWED_SIGNERS:-}" ]; then
            echo "::error title=Signing not configured::Set the RELEASE_TAG_ALLOWED_SIGNERS repo variable to the maintainer's SSH signing public key before releasing. Failing closed."
            exit 1
          fi
          printf '%s\n' "${ALLOWED_SIGNERS}" > "${RUNNER_TEMP}/allowed_signers"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "${RUNNER_TEMP}/allowed_signers"
          # actions/checkout leaves refs/tags/<TAG> pointing at the dereferenced COMMIT,
          # so `git verify-tag` can't find the annotated tag OBJECT and fails on EVERY
          # tag ("cannot verify a non-tag object of type commit") — signed or not.
          # Re-fetch the tag ref explicitly so it points at the signed tag object.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          echo "Verifying signature on ${TAG} …"
          git verify-tag "${TAG}"
          echo "::notice title=Signed tag verified::${TAG} carries a valid signature from the pinned maintainer key."

  build-rust:
    name: Build Rust binaries
    needs: verify-signed-tag
    # `!= 'failure'` (not `== 'success'`) so a dispatch dry run, where
    # verify-signed-tag is SKIPPED, still builds — while a tag whose signature
    # check FAILED still blocks here, including a dispatch aimed at a tag ref.
    if: ${{ !cancelled() && needs.verify-signed-tag.result != 'failure' }}
    strategy:
      # One target's failure must not cancel the others: the v0.2.1 run lost the
      # aarch64-darwin result to fail-fast, hiding whether the break was
      # aarch64-wide or linux-only. Full matrix results > a few saved minutes.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable 2024-12
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust deps
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Add build target to the pinned toolchain
        # rust-toolchain.toml pins the repo to 1.95, but dtolnay/rust-toolchain
        # (`@stable`) installed the cross-target onto the STABLE toolchain — a
        # DIFFERENT toolchain from the 1.95 override cargo actually runs. So
        # `cargo build --target <cross>` on 1.95 can't find std → E0463 "can't
        # find crate for `core`". Add the target to the ACTIVE toolchain from
        # inside the repo (rust-toolchain.toml applies here). Host-target rows
        # (x86_64-linux on ubuntu, aarch64-darwin on macOS) are a harmless no-op.
        run: rustup target add ${{ matrix.target }}

      - name: Build gateway release binary
        env:
          # Installing gcc-aarch64-linux-gnu above is NOT enough — it made the C
          # deps (aws-lc-sys, ring, blake3) cross-build correctly via the `cc`
          # crate, but cargo was never told which linker to use for the final
          # Rust link, so it fell back to the host x86_64 `cc`/`gcc-ld` and every
          # aarch64 object came back "incompatible with elf64-x86-64".
          # The cross toolchain was present, reported, and not load-bearing.
          # Harmless on the other three matrix rows: cargo only reads the env var
          # matching the target it is building.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --package gateway --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3  # v4.3.1
        with:
          name: gateway-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/gateway

  sign-and-release:
    name: Sign artifacts and publish release
    needs: build-rust
    permissions:
      contents: write   # softprops/action-gh-release creates the GitHub Release
      id-token: write   # cosign sign-blob keyless OIDC
    # Tag refs only — a dispatch dry run builds and stops. Unlike the publish-*
    # jobs it cannot inherit the skip from verify-signed-tag (it hangs off
    # build-rust, which DOES run on dispatch), so it is gated explicitly.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download all binary artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          path: artifacts/

      # ALL FOUR downloaded binaries are literally named `gateway` — the matrix
      # uploads `target/<target>/release/gateway` under artifact name
      # `gateway-<target>`, so download-artifact yields
      # artifacts/gateway-<target>/gateway ×4. A GitHub Release's asset namespace
      # is FLAT and keyed by BASENAME, so uploading all four would resolve to a
      # single asset called `gateway` (softprops deletes-and-replaces on a name
      # collision) — the release would go green carrying ONE binary and ONE
      # bundle instead of four and four. Never observed, because this job has
      # been SKIPPED on all 8 runs of this workflow's life. Flatten to unique
      # names first, and fail closed if the count is not 4.
      - name: Give every binary a unique release-asset name
        run: |
          set -euo pipefail
          mkdir -p release
          for d in artifacts/gateway-*/; do
            target="$(basename "$d")"          # gateway-<target>
            cp "${d}gateway" "release/${target}"
            chmod +x "release/${target}"
          done
          ls -l release/
          n=$(find release -maxdepth 1 -type f -name 'gateway-*' | wc -l)
          echo "staged ${n} binaries"
          [ "$n" -eq 4 ] || { echo "::error title=Incomplete binary set::expected 4 target binaries, staged ${n} — refusing to publish a partial release"; exit 1; }

      - name: Install Cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20  # v3.5.0

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Sign binaries with Sigstore Cosign (keyless OIDC)
        run: |
          set -euo pipefail
          for binary in release/gateway-*; do
            case "$binary" in *.cosign.bundle) continue ;; esac
            cosign sign-blob \
              --yes \
              --oidc-issuer=https://token.actions.githubusercontent.com \
              --bundle="${binary}.cosign.bundle" \
              "${binary}"
          done
          ls -l release/

      - name: Sign SBOM
        run: |
          cosign sign-blob \
            --yes \
            --oidc-issuer=https://token.actions.githubusercontent.com \
            --bundle=sbom.cyclonedx.json.cosign.bundle \
            sbom.cyclonedx.json

      - name: Create GitHub Release
        # v3.0.2. The previous pin `e7a8f851…` labelled "v2.2.0" DID NOT EXIST —
        # `GET /repos/softprops/action-gh-release/commits/e7a8f851…` returns 422
        # "No commit found for SHA". It satisfied the SHA-pin grep (40 hex chars)
        # and could not run: the v0.2.2 tag died at `Set up job` in 4s with
        # "Unable to resolve action … unable to find version", the release carried
        # ZERO assets, and the SLSA generator's upload-assets then had no release
        # to attach to. Format-pinning is not existence — every pin in this repo
        # is now verified against the API by pre-release-checks.sh check [5].
        #
        # Resolution note, because it is the same trap one level down:
        # `git/ref/tags/v3.0.2` returns an ANNOTATED TAG OBJECT (fe965f7a…), not
        # a commit. `uses:` needs the COMMIT, so the tag object must be
        # dereferenced (`git/tags/<sha>` -> .object.sha = 3d0d9888…).
        #
        # v3 vs v2: v3.0.0's ONLY documented change is the action runtime moving
        # Node 20 -> Node 24, which the hosted runners already force (the v0.2.2
        # logs carry "actions target Node.js 20 but are being forced to run on
        # Node.js 24"). v3.0.2 is a patch hardening streamed ASSET UPLOADS — the
        # exact path this job depends on.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          # `release/*` — the uniquely-named staging dir, NOT `artifacts/**/*`
          # (four basename-identical `gateway` files; see the staging step above).
          # Expected asset count: 4 binaries + 4 .cosign.bundle + the SBOM and its
          # bundle = 10.
          files: |
            release/*
            sbom.cyclonedx.json
            sbom.cyclonedx.json.cosign.bundle
          generate_release_notes: true
          body: |
            ## Verification

            All binaries are signed with [Sigstore Cosign](https://sigstore.dev) keyless OIDC.

            Verify a binary with a current cosign release.
            ```bash
            cosign verify-blob \
              --bundle <binary>.cosign.bundle \
              --certificate-identity-regexp="https://github.com/tracelane/tracelane/.*" \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              <binary>
            ```

            SBOM (CycloneDX JSON) is attached as `sbom.cyclonedx.json`.

  slsa-provenance:
    name: Generate SLSA Build Level 3 provenance
    needs: build-rust
    if: startsWith(github.ref, 'refs/tags/')  # tag refs only (see sign-and-release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download all binary artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          path: artifacts/

      - name: Generate SHA-256 hashes for all binaries
        id: hash
        run: |
          cd artifacts
          # Generate hashes for all downloaded binaries
          find . -type f -name "gateway" | while read f; do
            sha256sum "$f"
          done > ../binary-hashes.txt
          cat ../binary-hashes.txt
          HASH_B64=$(base64 -w0 ../binary-hashes.txt)
          echo "hashes=${HASH_B64}" >> "$GITHUB_OUTPUT"

      - name: Attest binary provenance (GitHub Attestations / SLSA L3)
        uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c  # v1.4.3
        with:
          subject-path: |
            artifacts/gateway-x86_64-unknown-linux-gnu/gateway
            artifacts/gateway-aarch64-unknown-linux-gnu/gateway
            artifacts/gateway-x86_64-apple-darwin/gateway
            artifacts/gateway-aarch64-apple-darwin/gateway

      - name: Upload hash manifest
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3  # v4.3.1
        with:
          name: binary-hashes
          path: binary-hashes.txt

  slsa-framework-generator:
    name: SLSA L3 provenance (slsa-github-generator)
    needs: [build-rust, slsa-provenance]
    if: startsWith(github.ref, 'refs/tags/')  # tag refs only (see sign-and-release)
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@5a775b367a56d5bd118a224a811bba288150a563  # v2.0.0
    with:
      base64-subjects: "${{ needs.slsa-provenance.outputs.hashes }}"
      upload-assets: true

  # publish-crate (tracelane-shared) DROPPED for v0.2.1 (2026-07-27): crates.io
  # Trusted Publishing cannot create a NEW crate — RFC 3691 requires an initial
  # manual publish before a Trusted Publisher config can exist (no PyPI-style
  # pending pre-registration), so an OIDC publish-crate would 403 on the first tag.
  # Nothing consumes tracelane-shared and it is unrelated to the ADR-070 verifier
  # fix. If ever needed publicly: manual `cargo publish` with a token, then
  # configure Trusted Publishing for subsequent versions — a separate task.

  publish-npm:
    name: Publish to npm (Trusted Publishing / OIDC)
    # Gated on the SIGNED-TAG check only, NOT on build-rust/sign-and-release.
    # These packages are TS/Python (verifier/SDK/CLI) built in THIS job — they
    # consume no gateway binary or GitHub-release artifact, so chaining them
    # behind the Rust binary build was a false coupling: a residual gateway
    # cross-compile failure must not strand a verifier hotfix. The signed tag is
    # the real authorization gate; each job's own build step is its compile gate.
    needs: verify-signed-tag
    runs-on: ubuntu-latest
    # NO `environment:` — npm Trusted Publishing requires the token's environment
    # claim to EXACTLY match the package config (unlike PyPI, where blank = any).
    # The npm configs are registered with a BLANK environment, so this job must
    # emit NO environment claim or npm 401s mid-release. (If the npm configs are
    # ever re-registered with environment `npm`, re-add `environment: npm` here.)
    permissions:
      id-token: write  # Required for npm OIDC Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3.0.0
        with:
          version: 9

      - name: Setup Node
        # node 24 ships npm 11.5.1+, which performs npm's tokenless OIDC Trusted
        # Publishing exchange (mints a short-lived token from the id-token OIDC
        # claim). node 22 ships npm 10.x, which does NOT — and `pnpm publish`
        # (pnpm 9) does not do the exchange either, so the v0.2.1 run published
        # anonymously and npm masked the unauthorized PUT as `E404`. We therefore
        # PACK with pnpm (rewrites workspace:*) and PUBLISH with the npm CLI below.
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8  # v4.0.2
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build the published packages
        # The published packages ship `files: ["dist"]`; build them explicitly
        # (root `pnpm build` only builds the dashboard). pnpm builds in
        # dependency order, so the verifier is built before the CLI that uses it.
        #
        # @tracelanedev/mcp (PLT-21): its `prebuild` runs two gates that must
        # fail the RELEASE, not a later `mcp-publisher publish` — the eval
        # manifest must match `evals/` on disk, and server.json / package.json /
        # src/version.ts must agree on name + version. Both carry `--selftest`.
        run: pnpm --filter @tracelanedev/audit-verifier --filter @tracelanedev/sdk --filter @tracelanedev/cli --filter @tracelanedev/mcp build

      - name: Publish @tracelanedev/* (npm CLI · OIDC Trusted Publishing · no long-lived token)
        # ADR-008: Trusted Publishing OIDC for crates.io, npm, PyPI, Docker Hub.
        # No long-lived tokens. The npm CLI (node 24, npm 11.5.1+) performs the
        # tokenless OIDC exchange from `id-token: write` when the package has a
        # Trusted Publisher on npmjs.com (owner=tracelane, repo=tracelane,
        # workflow=release.yml, environment=BLANK — this job emits no environment).
        #
        # Why npm CLI and not `pnpm publish`: pnpm 9 does not perform npm's OIDC
        # exchange, so the v0.2.1 run PUT anonymously → E404. We PACK with pnpm
        # (which rewrites `workspace:*` → the concrete version, required because
        # @tracelanedev/cli depends on @tracelanedev/audit-verifier via workspace:*)
        # and PUBLISH the resulting tarball with the npm CLI (does the OIDC exchange
        # + --provenance). Publish ORDER matters: the verifier must be on npm before
        # the CLI so the CLI's rewritten dependency resolves.
        #
        # IDEMPOTENT: a coordinated tag fires this for ALL four packages, but some
        # may already be on npm (e.g. the SDK at 0.1.0, or a re-tagged run). Skip any
        # version already present so one unchanged package never strands the rest.
        #
        # @tracelanedev/mcp is LAST deliberately. It is the only entry that has
        # never been published, and npm's Trusted Publishing config is created on
        # an EXISTING package's settings page — same first-publish gap already
        # documented above for crates.io. Ordering it last means the bootstrap
        # gap cannot strand the three packages that do have publishers. It still
        # FAILS the job (never a silent skip): a release that was supposed to
        # ship the MCP server and did not must be red, and the pre-flight below
        # says exactly which manual step unblocks it.
        # (Wording is deliberate: `.github/` ships in the public export, and the
        # banned-phrase guard blocks the internal term here. PL-6 regressed on
        # 2026-08-09 for exactly this reason and would have blocked the v1.0.0 tag.)
        run: |
          set -euo pipefail
          echo "npm $(npm --version) (need >= 11.5.1 for tokenless OIDC Trusted Publishing)"
          for pkg in @tracelanedev/audit-verifier @tracelanedev/sdk @tracelanedev/cli @tracelanedev/mcp; do
            dir=$(pnpm --filter "$pkg" exec pwd | tail -1)
            ver=$(node -p "require('${dir}/package.json').version")
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "· $pkg@$ver already on npm — skipping (unchanged)"
              continue
            fi
            if ! npm view "$pkg" version >/dev/null 2>&1; then
              echo "::warning title=First publish of ${pkg}::${pkg} has never been published. npm Trusted Publishing is configured on an existing package's settings page, so this PUT may 404/401 until a maintainer bootstraps the first version and registers the trusted publisher (owner=tracelane, repo=tracelane, workflow=release.yml, environment=BLANK)."
            fi
            packdir="${RUNNER_TEMP}/pack-$(echo "$pkg" | tr '/@' '__')"
            mkdir -p "$packdir"
            echo "· packing $pkg@$ver (pnpm pack rewrites workspace:* → concrete)"
            ( cd "$dir" && pnpm pack --pack-destination "$packdir" )
            tgz=$(ls "$packdir"/*.tgz | head -1)
            echo "· publishing $tgz via npm CLI (OIDC Trusted Publishing + provenance)"
            npm publish "$tgz" --access public --provenance
          done

      - name: Assert @tracelanedev/mcp is installable as `npx @tracelanedev/mcp`
        # A 200 from `npm publish` is not the end state PLT-21 promises. The
        # published one-liner is what customers run, so resolve it from the
        # REGISTRY (not the workspace) and prove the bin exists with a node
        # hashbang — the exact defect 0.1.0 shipped (mode 0644, no hashbang).
        # `npm exec` would run the server and block on stdio, so this inspects
        # the fetched package instead of starting it.
        run: |
          set -euo pipefail
          ver=$(node -p "require('./apps/mcp/package.json').version")
          work="${RUNNER_TEMP}/npx-proof"
          mkdir -p "$work"
          ( cd "$work" \
            && npm pack "@tracelanedev/mcp@${ver}" --silent >/dev/null \
            && tar -xzf ./*.tgz )
          binrel=$(node -p "Object.values(require('${work}/package/package.json').bin)[0]")
          bin="${work}/package/${binrel}"
          test -f "$bin" || { echo "::error title=npx target missing::${binrel} is not in the published tarball"; exit 1; }
          head -c 19 "$bin" | grep -qx '#!/usr/bin/env node' || {
            echo "::error title=npx target has no hashbang::npm's bin symlink hands ${binrel} to the shell; \`npx @tracelanedev/mcp\` cannot start"; exit 1; }
          name=$(node -p "require('${work}/package/package.json').mcpName || ''")
          test -n "$name" || { echo "::error title=mcpName missing::the MCP registry cannot verify npm ownership without package.json mcpName"; exit 1; }
          echo "::notice title=npx @tracelanedev/mcp verified::@tracelanedev/mcp@${ver} resolves from npm, bin=${binrel}, mcpName=${name}"

  publish-mcp-registry:
    name: Publish @tracelanedev/mcp to the MCP Registry (OIDC)
    # MUST follow publish-npm: the registry's ownership check fetches
    # registry.npmjs.org/@tracelanedev/mcp/<version> and requires the published
    # package.json to carry `mcpName` equal to server.json's `name`
    # (registry internal/validators/registries/npm.go:90,94). Submitting before
    # the npm version exists is a guaranteed rejection.
    needs: [verify-signed-tag, publish-npm]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # NO `environment:` — the registry's OIDC exchange grants `io.github.<owner>/*`
    # off the `repository_owner` claim alone; it does not read an environment
    # claim, and adding one would only narrow the token for no gain.
    permissions:
      id-token: write  # Required for the registry's GitHub OIDC token exchange
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install mcp-publisher (pinned + checksum-verified)
        # PINNED, not `releases/latest`. The upstream example curls `latest`,
        # which silently swaps the binary that holds an OIDC token capable of
        # publishing under io.github.tracelane/*. Checksum from the release's
        # own registry_1.8.1_checksums.txt.
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/mcp-publisher.tar.gz" "$url"
          echo "${MCP_PUBLISHER_SHA256}  ${RUNNER_TEMP}/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/mcp-publisher.tar.gz" -C "${RUNNER_TEMP}" mcp-publisher
          chmod +x "${RUNNER_TEMP}/mcp-publisher"
          "${RUNNER_TEMP}/mcp-publisher" --version

      - name: Verify server.json agrees with the published package
        # Same gate the package's own `prebuild` runs — re-run it here so this
        # job fails on drift BEFORE it spends an OIDC token on a submission the
        # registry would reject.
        run: node apps/mcp/scripts/check-registry-manifest.mjs --check

      - name: Login to the MCP Registry via GitHub OIDC (no long-lived token)
        # Grants `io.github.<repository_owner>/*` — i.e. io.github.tracelane/*,
        # which covers io.github.tracelane/tracelane-mcp. No secret involved.
        run: '"${RUNNER_TEMP}/mcp-publisher" login github-oidc'

      - name: Publish server.json
        run: '"${RUNNER_TEMP}/mcp-publisher" publish apps/mcp/server.json'

      - name: Confirm the server is live in the registry
        # `publish` exiting 0 is not the end state PLT-21 promises. Read the
        # server back OUT of the public registry and assert the version we just
        # submitted is the one listed and its status is active — otherwise a
        # no-op accept is indistinguishable from a real submission.
        run: |
          set -euo pipefail
          name=$(node -p "require('./apps/mcp/server.json').name")
          want=$(node -p "require('./apps/mcp/server.json').version")
          curl -fsSL --get \
            --data-urlencode "search=${name}" \
            --data-urlencode "version=latest" \
            https://registry.modelcontextprotocol.io/v0/servers > "${RUNNER_TEMP}/registry.json"
          node -e '
            const [file, name, want] = process.argv.slice(1);
            const body = JSON.parse(require("node:fs").readFileSync(file, "utf8"));
            const hit = (body.servers ?? [])
              .map((e) => ({ s: e.server, meta: e._meta?.["io.modelcontextprotocol.registry/official"] }))
              .find((e) => e.s?.name === name);
            if (!hit) {
              console.log(`::error title=MCP registry has no such server::${name} is absent from the registry after publish`);
              process.exit(1);
            }
            if (hit.s.version !== want) {
              console.log(`::error title=MCP registry did not take the submission::expected ${name}@${want}, registry reports ${hit.s.version}`);
              process.exit(1);
            }
            if (hit.meta?.status && hit.meta.status !== "active") {
              console.log(`::error title=MCP registry entry is not active::${name}@${want} has status ${hit.meta.status}`);
              process.exit(1);
            }
            console.log(`::notice title=MCP registry updated::${name}@${hit.s.version} is live — clients can discover \`npx @tracelanedev/mcp\``);
          ' "${RUNNER_TEMP}/registry.json" "$name" "$want"

  publish-pypi:
    name: Publish tracelane (SDK) to PyPI (Trusted Publishing / OIDC)
    # Gated on the SIGNED-TAG check only, NOT on build-rust/sign-and-release.
    # These packages are TS/Python (verifier/SDK/CLI) built in THIS job — they
    # consume no gateway binary or GitHub-release artifact, so chaining them
    # behind the Rust binary build was a false coupling: a residual gateway
    # cross-compile failure must not strand a verifier hotfix. The signed tag is
    # the real authorization gate; each job's own build step is its compile gate.
    needs: verify-signed-tag
    runs-on: ubuntu-latest
    # PyPI project "tracelane". Trusted publisher (entry 1):
    # owner=tracelane, repo=tracelane, workflow=release.yml, environment=pypi.
    # The PyPI registration is pinned to environment=pypi (tightened from blank),
    # so it accepts ONLY a token carrying this job's `pypi` OIDC claim below. The
    # `pypi` environment binds the OIDC claim + branch policy (v*/main); it is NOT a
    # reviewer gate — the release gate is the signed-tag ruleset (verify-signed-tag).
    # Renaming the environment here requires updating the PyPI registration to
    # match, or the publish OIDC exchange 403s.
    environment: pypi  # Requires OIDC Trusted Publishing configured on pypi.org
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c  # v5.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --require-hashes -r scripts/ci/requirements/build.txt

      - name: Build Python SDK
        run: python -m build packages/sdk-python/

      - name: Publish to PyPI via OIDC (no long-lived token)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: packages/sdk-python/dist/
          # IDEMPOTENT: a re-tag re-runs this job, but the version may already be on
          # PyPI (tracelane 0.1.0 shipped on the first successful run). Without this,
          # a re-run 400s on "file already exists" — a false-red on a re-tag. Skips
          # any file already on the index; only new versions upload. Mirrors the npm skip.
          skip-existing: true

  publish-pypi-verifier:
    name: Publish tracelane-audit-verifier to PyPI (Trusted Publishing / OIDC)
    # Gated on the SIGNED-TAG check only, NOT on build-rust/sign-and-release.
    # These packages are TS/Python (verifier/SDK/CLI) built in THIS job — they
    # consume no gateway binary or GitHub-release artifact, so chaining them
    # behind the Rust binary build was a false coupling: a residual gateway
    # cross-compile failure must not strand a verifier hotfix. The signed tag is
    # the real authorization gate; each job's own build step is its compile gate.
    needs: verify-signed-tag
    runs-on: ubuntu-latest
    # PyPI project "tracelane-audit-verifier" — a SEPARATE pending trusted
    # publisher from "tracelane" above. PyPI keys pending-publisher identity
    # on the exact (owner, repo, workflow filename, environment) tuple; both
    # jobs share owner=tracelane, repo=tracelane, workflow=release.yml, so
    # the environment must be distinct or PyPI rejects the second
    # registration with "a pending trusted publisher matching this
    # configuration has already been registered for a different project
    # name." Register at pypi.org/manage/account/publishing/ with EXACTLY:
    #   PyPI project name : tracelane-audit-verifier
    #   Owner              : tracelane
    #   Repository name    : tracelane
    #   Workflow name      : release.yml
    #   Environment name   : pypi-audit-verifier   (must match below verbatim)
    environment: pypi-audit-verifier
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c  # v5.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --require-hashes -r scripts/ci/requirements/build.txt

      - name: Build audit verifier
        run: python -m build packages/verifier-python/

      - name: Publish to PyPI via OIDC (no long-lived token)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: packages/verifier-python/dist/
          # IDEMPOTENT: tracelane-audit-verifier 0.2.1 shipped on the first run; a
          # re-tag would 400 on "file already exists" without this. Skip existing.
          skip-existing: true
