name: SBOM

on:
  schedule:
    - cron: "0 4 * * 1"  # Weekly Monday 04:00 UTC
  workflow_dispatch:

# Moved off per-push (2026-06-06 CI cost pass): SBOM is a slow scan and was
# duplicated by a now-removed ci.yml `sbom` job. Runs weekly + on demand.
concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  generate-sbom:
    name: Generate and sign CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2 (cosign 3.0.6)

      - name: Generate full-repo SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5  # v0.17.0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5  # v0.17.0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Record the cosign version actually installed
        # The installer's DEFAULT cosign version is what we get (no
        # `cosign-release` input, per sigstore's own guidance). Print it so the
        # run RECORDS which binary signed, rather than us inferring it from the
        # action tag — cosign-installer v4.1.2 is expected to give cosign 3.0.6.
        run: cosign version

      - name: Sign SBOM with Sigstore Cosign (keyless OIDC)
        run: |
          cosign sign-blob \
            --yes \
            --oidc-issuer=https://token.actions.githubusercontent.com \
            --bundle=sbom.cyclonedx.json.cosign.bundle \
            sbom.cyclonedx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3  # v4.3.1
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.cyclonedx.json
            sbom.cyclonedx.json.cosign.bundle
            sbom.spdx.json
          retention-days: 365
