# Public Actions are unlimited and free; private are capped at 2,000 min/month
# are shared — the public repo is built from this tree — so the trigger list
# cannot be edited to cut private cost without also disabling the PUBLIC run,
# which is now the only always-on gate. The split is therefore a job-level
# repository condition, which exports unchanged and evaluates true on public.
#
# PUBLIC-ONLY: nothing consumes a private SBOM; the public one is the published artifact.
name: SBOM

on:
  schedule:
    - cron: "0 4 * * 1"  # Weekly Monday 04:00 UTC
  workflow_dispatch:

# Moved off per-push (2026-06-06 CI cost pass): SBOM is a slow scan and was
# duplicated by a now-removed ci.yml `sbom` job. Runs weekly + on demand.
concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  generate-sbom:
    # PUBLIC-ONLY: nothing consumes a private SBOM; the public one is the published artifact.
    if: github.repository == 'tracelane/tracelane'
    name: Generate and sign CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20  # v3.5.0 (cosign 2.2.4)

      - name: Generate full-repo SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Record the cosign version actually installed
        # The installer's DEFAULT cosign version is what we get (no
        # `cosign-release` input, per sigstore's own guidance). Print it so the
        # run RECORDS which binary signed, rather than us inferring it from the
        run: cosign version

      - name: Sign SBOM with Sigstore Cosign (keyless OIDC)
        run: |
          cosign sign-blob \
            --yes \
            --oidc-issuer=https://token.actions.githubusercontent.com \
            --bundle=sbom.cyclonedx.json.cosign.bundle \
            sbom.cyclonedx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3  # v4.3.1
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.cyclonedx.json
            sbom.cyclonedx.json.cosign.bundle
            sbom.spdx.json
          retention-days: 365
