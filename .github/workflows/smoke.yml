name: E2E Smoke

# End-to-end integration smoke (punchlist #4): proves a real OTLP span shipped
# to the ingest receiver lands in ClickHouse, tenant-scoped. Slow (boots live
# infra + builds ingest), so it is opt-in: it runs on manual dispatch and on
# PRs labelled `smoke` (mirrors the `bench` job's `hot-path` gate). Promote it
# to a required check once it has a green history.

on:
  workflow_dispatch:
    inputs:
      hosted_runners:
        description: >-
          Run this GitHub-hosted smoke job? Founder approval only (2026-09-07).
          Leave "no" for a normal manual trigger that intentionally no-ops.
        type: choice
        options:
          - "no"
          - "approved-by-founder"
        default: "no"
  pull_request:
    branches: [main]
    # Allowlist (not paths-ignore) because this is a TARGETED integration test,
    # not a scanner: it proves an OTLP span reaches ClickHouse, so only the
    # ingest path and the harness itself can affect its result. The fail-safe
    # argument that makes CodeQL a `paths-ignore` does not apply — a new
    # directory outside this list cannot change what this test asserts.
    #
    # HONEST ABOUT THE BENEFIT: this saves ~0 minutes. The job is already gated
    # by `if:` to dispatch-or-`smoke`-label, and a job skipped by `if:` is not
    # billed. What it removes is the run RECORD — 10 of 10 prior runs were
    # `skipped`, which reads as background noise and is exactly how a control
    # that never executes stays unnoticed. Fewer, more meaningful rows.
    paths:
      - "crates/ingest/**"
      - "crates/shared/**"
      - "scripts/smoke/**"
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: Integration smoke (ingest -> ClickHouse)
    # HOSTED-RUNNER OPT-IN (founder, 2026-09-07 — hosted minutes are billed,
    # "only in extreme case with my approval"). This job CANNOT move to
    # `${{ vars.CI_RUNNER || 'ubuntu-latest' }}` (tl-node-1): `e2e-smoke.sh` runs
    # `docker compose up clickhouse nats`, which binds the SAME host ports
    # (8123/4222) prod uses on that box — identical to why `live-eval-gate` in
    # ci.yml stays off the self-hosted node. So it stays `ubuntu-latest` and
    # instead requires the same dispatch approval as ci.yml's three hosted jobs.
    # This also retires the `pull_request`-label path in practice: a labelled PR
    # has no `inputs` context, so the condition below is always false for it —
    # the run will report `skipped`, same as the 10-of-10 history this file
    # already notes, just for a different reason now.
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.hosted_runners == 'approved-by-founder'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable 2024-12

      - name: Cache Rust deps
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c  # v5.0.0
        with:
          python-version: "3.12"

      - name: Install OTLP exporter (for the span sender)
        run: pip install --require-hashes -r scripts/ci/requirements/smoke.txt

      - name: Run the e2e smoke
        run: bash scripts/smoke/e2e-smoke.sh
