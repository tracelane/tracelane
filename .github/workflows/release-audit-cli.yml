name: Release tracelane-audit CLI

# ADR-034: cross-compile the public audit verifier CLI for four
# targets, Cosign-sign each artefact, attach CycloneDX SBOM + SLSA
# Build Level 3 provenance, then Trusted-Publish to crates.io via the
# crates-io GitHub Environment (no long-lived registry tokens).
#
# Tag format: v<semver>-audit-cli (e.g. `v0.1.0-audit-cli`). Triggers
# this workflow without firing the general `release.yml` (which keys
# off plain `v*` tags but excludes the `-audit-cli` suffix).

on:
  push:
    tags:
      - 'v*-audit-cli'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0-audit-cli)'
        required: true
        type: string

# Least privilege at the top; writes granted at the JOB that needs them.
# Verified per job (Scorecard TokenPermissionsID, release-audit-cli.yml:24):
#   build              -> contents:write (Upload to release, tag refs only)
#                       + id-token:write (cosign sign-blob keyless)
#   slsa-provenance    -> declares contents:read
#   slsa-l3 / publish-crates-io -> declare their own
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write   # `Upload to release` (tag refs only)
      id-token: write   # cosign sign-blob keyless OIDC
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            cross: true
            binary: tracelane-audit
          - target: x86_64-apple-darwin
            runner: macos-14
            cross: false
            binary: tracelane-audit
          - target: aarch64-apple-darwin
            runner: macos-14
            cross: false
            binary: tracelane-audit
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            cross: false
            binary: tracelane-audit.exe

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable 2024-12
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust deps
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Install musl tooling (Linux musl target only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Add build target to the pinned toolchain
        # `dtolnay/rust-toolchain@stable` installs `targets:` onto the STABLE
        # toolchain, but rust-toolchain.toml pins this repo to 1.95 — a DIFFERENT
        # toolchain, and the one cargo actually runs. So `cargo build --target
        # <x>` finds no std for <x> and fails E0463 "can't find crate for `core`".
        # `rustup target add` from inside the repo applies to the ACTIVE toolchain.
        # release.yml already carried this fix; this workflow never got it, and
        # because it had never once run, nobody found out. Host-target rows are a
        # harmless no-op.
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          cargo build --release -p tracelane-audit --target ${{ matrix.target }}

      - name: Stage artefact
        id: stage
        shell: bash
        run: |
          mkdir -p dist
          src=target/${{ matrix.target }}/release/${{ matrix.binary }}
          out=dist/tracelane-audit-${{ matrix.target }}
          if [[ "${{ matrix.binary }}" == *.exe ]]; then
            out="${out}.exe"
          fi
          cp "$src" "$out"
          # Compute SHA256 — used for SLSA provenance subject lines.
          if command -v sha256sum >/dev/null; then
            sha256sum "$out" > "${out}.sha256"
          else
            shasum -a 256 "$out" > "${out}.sha256"
          fi
          echo "out=$out" >> "$GITHUB_OUTPUT"
          ls -lah dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20  # v3.5.0

      - name: Cosign keyless sign
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign-blob --yes \
            --bundle "${{ steps.stage.outputs.out }}.cosign.bundle" \
            "${{ steps.stage.outputs.out }}"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5  # v0.17.0
        with:
          format: cyclonedx-json
          output-file: "dist/tracelane-audit-${{ matrix.target }}.sbom.cyclonedx.json"
          path: crates/tracelane-audit-cli

      - name: Upload to release
        # Tag refs only. This step lives in the (ungated) `build` job, so without
        # this it would run on a workflow_dispatch dry run and CREATE A PUBLIC
        # GITHUB RELEASE named after the free-form `tag` input. Gating the
        # downstream jobs alone is not enough — check every step with an external
        # effect, not just every job.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@69320dbe05506a9a39fc8ae11030b214ec2d1f87  # v2.0.5
        with:
          files: |
            dist/tracelane-audit-${{ matrix.target }}*
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}

  slsa-provenance:
    name: SLSA L3 provenance subjects
    needs: build
    # Tag refs only. `workflow_dispatch` is a BUILD-ONLY dry run: without these
    # gates a dispatch fell straight through to publish-crates-io and attempted a
    # real publish — and crates.io versions are immutable (yank-only). This
    # workflow had never run at all, so that footgun was never observed.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    outputs:
      hashes: ${{ steps.collect.outputs.hashes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Download release assets
        uses: robinraju/release-downloader@daf26c55d821e836577a15f77d86ddc078948b05  # v1.10
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          fileName: 'tracelane-audit-*'
          out-file-path: 'release-assets'

      - name: Compute base64 subjects
        id: collect
        shell: bash
        run: |
          cd release-assets
          # Build the `name:hash` lines SLSA expects, then base64.
          {
            for f in tracelane-audit-*; do
              [[ "$f" == *.sha256 || "$f" == *.cosign.bundle || "$f" == *.sbom.cyclonedx.json ]] && continue
              h=$(sha256sum "$f" | awk '{print $1}')
              echo "$h  $f"
            done
          } > _subjects.txt
          b64=$(base64 -w0 _subjects.txt)
          echo "hashes=$b64" >> "$GITHUB_OUTPUT"

  slsa-l3:
    name: SLSA L3 provenance generator
    needs: slsa-provenance
    if: startsWith(github.ref, 'refs/tags/')  # tag refs only (see slsa-provenance)
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@5a775b367a56d5bd118a224a811bba288150a563  # v2.0.0
    with:
      base64-subjects: "${{ needs.slsa-provenance.outputs.hashes }}"
      upload-assets: true

  publish-crates-io:
    name: Trusted-Publish to crates.io
    needs: [build, slsa-l3]
    # Tag refs only (see slsa-provenance). NOTE for the first real tag: crates.io
    # Trusted Publishing cannot create a NEW crate (RFC 3691 — no PyPI-style
    # pending pre-registration), so if `tracelane-audit` is not yet on crates.io
    # this job 403s until one manual token publish seeds it. Same reason
    # publish-crate was dropped from release.yml for v0.2.1.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable 2024-12

      - name: Cargo publish (Trusted Publishing OIDC, no static token)
        run: cargo publish -p tracelane-audit --locked
