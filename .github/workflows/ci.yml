# ── PRIVATE-MINUTE POLICY (2026-08-01) ────────────────────────────────
# Workflow files are SHARED with the public repo, so the trigger list cannot be
# edited to cut private cost without disabling the public run too. The split is
# a job-level repository condition on the three root jobs.
name: CI

# ── Tiering + runner target ──────────────────────
# This workflow does NOT name a box. CI home = GitHub Actions, LIVE + tiered.
# History (, RESOLVED 2026-07-02): the account's free Actions minutes were
# EXHAUSTED (2,000/2,000) from ~2026-06-20 with a budget cap blocking paid
# overflow, so GitHub started no runs until the 2026-07-01 monthly reset — the
# "disabled_manually" / "payments failed" strings GitHub showed were BOTH
# misleading; the real cause was minutes-exhaustion, which self-healed on the
# reset (no fix, no cap raise). Permanent fix = the public-repo flip (free
# GitHub-hosted Actions forever, no cap). GCP Cloud Build running `ci/run-ci.sh`
# (separate GitHub App + service; WIF, no PAT) and on-node `bash ci/run-ci.sh`
# remain zero-Actions-budget fallbacks, not the primary path.
#
# `runs-on` is host-neutral via the `CI_RUNNER` repo variable, defaulting to
# `ubuntu-latest` — correct for the most-likely restoration path (public repo →
# free GitHub-hosted minutes; there, self-hosted would be the WRONG default). To
# dispatch to a self-hosted runner instead (private repo + a free box), set repo
# variable CI_RUNNER (e.g. =tl-node-1) — no YAML edit for the light jobs.
#
# PER-JOB ROUTING — CORRECTED 2026-08-10 by observation. The previous text here
# claimed the heavy cargo/stack jobs were "HARDCODED `ubuntu-latest` and never hit
# the runner". THAT WAS FALSE, and run 31369123020 proved it: with
# `CI_RUNNER=tl-node-1`, Rust (fmt·clippy·test), Ingest release-profile guard and
# Span publish → JetStream ALL ran on tl-node-1 and passed.
#
# `grep -n 'runs-on:'` is the authority: 10 of 14 jobs use the
# `${{ vars.CI_RUNNER || 'ubuntu-latest' }}` indirection. Only FOUR are hardcoded
# `ubuntu-latest` — repo guards, live-eval-gate, bench, behavioral-tier-ran.
#
# The saturation hazard is real but is ALREADY MITIGATED, which is why the cold
# build no longer takes the box down: the runner's systemd unit is cgroup-capped at
# CPUQuotaPerSecUSec=2.4s (2.4 of 4 cores) and MemoryMax=8G. Measured during that
# run: load ~1.3, prod untouched, SSH never lost.
#
# MEASURED COST of the routing, same run: 10 billable minutes (repo guards 1 +
# live-eval-gate 9) against 23 minutes that ran free on tl-node-1 — 78% off the
# ~45-minute baseline for a PR push.
#
# Tiers (apply whenever this workflow actually runs):
#   • FAST tier (fmt·clippy·unit-test, web, python, grep guards, secret-scan):
#     on push-to-main + every PR-to-main. Path-scoped by the `changes` job.
#   • FULL/BEHAVIORAL tier (eval-suite, span-publish-integration, live-eval-gate,
#     bench): on PR-to-main (gates the merge) + post-merge main push + WEEKLY +
#     manual dispatch. NOT on feature-branch pushes.
#   • Feature-branch pushes do NOT trigger CI — the per-push gate there is local
#     `scripts/verify-all.sh` (mirrors every infra-free check). Opening the PR to
#     main is what runs the behavioral net.
#   • WEEKLY (cron) + workflow_dispatch run the FULL suite regardless of paths
#     (the `changes` job fail-safes to run-all on non-push/PR events) — the
#     scheduled safety net for a path-gate miss.
#
# BUDGET: on GitHub-hosted Linux (the CI_RUNNER default), a full+behavioral run
# (live-eval-gate + bench + cold builds) is ~50-90 billed min. A DAILY such run
# alone would exceed the 2,000 free private-repo min/month — so the scheduled net
# is WEEKLY, not nightly. Weekly (~4×) + hot-path-PR behavioral + fast-tier push
# stays well under 2,000 → ~$0. For a true nightly net at $0, run `bash
# ci/run-ci.sh` on-node via cron (free, off GitHub's budget). Self-hosted
# runners (CI_RUNNER=self-hosted) don't consume billed minutes at all.
#
# Portable fallback (no CI provider at all): `bash ci/run-ci.sh` runs the SAME
# gateway→NATS→ingest→ClickHouse live-eval on any Docker host (proven on-node
# 2026-06-22).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `ready_for_review` is NOT in the default set (opened/synchronize/reopened),
    # so without it a PR marked ready would never get its first real run — the
    # draft guard below would have been a one-way door.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 3 * * 0" # weekly, Sun 03:00 UTC — full + behavioral, all paths (budget: not daily)
  workflow_dispatch: {} # manual full run (use to validate the runner end-to-end)

# Superseded runs are CANCELLED. Re-enabled 2026-07-31 after the precondition it
# was disabled for stopped holding.
#
# It was set false on 2026-07-13 because on the SELF-HOSTED runner a cancelled
# L16 sweep orphans its `next dev`(turbopack) + Playwright + chrome-headless
# children (SIGKILL skips cleanup): they run 30+ min, pin the box at load 25 and
# knock the runner offline. That hazard is real but is specific to a persistent
# machine — a GitHub-hosted runner discards the whole VM, so an orphan cannot
# survive a cancel.
#
# Verified before flipping: `vars.CI_RUNNER` is UNSET on this repo, and the one
# registered self-hosted runner (`tl-node-1`) carries labels
# `self-hosted,Linux,X64,tl-node-1` — it does NOT carry `ubuntu-latest`, so it
# cannot pick up any job here. Every job is GitHub-hosted.
#
# PRECONDITION, and it is load-bearing: if `CI_RUNNER` is ever set back to
# `tl-node-1`, the 10 jobs using the `${{ vars.CI_RUNNER || 'ubuntu-latest' }}`
# indirection move to the persistent box and this flip RE-ARMS the orphan
# problem. Set `cancel-in-progress: false` again in the same change, or drop the
# indirection first.
#
# Why it matters now: queued-not-cancelled means a rapid push series pays full
# price for every intermediate run, and the 2,000-minute Free allowance is the
# binding constraint.
# Least privilege. The ONLY token use in this workflow is the `changes` job's
# `gh api repos/.../compare` — a read. No job creates a release, pushes a
# package, or uploads SARIF, so nothing here needs write. Declared explicitly
# rather than left to the repository default, which is what OpenSSF Scorecard
# flags: an unset top-level `permissions` inherits whatever the repo default
# happens to be, so the grant is invisible in the file and can widen without a
# diff. (Scorecard TokenPermissionsID, ci.yml:1)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # MUST be false whenever `CI_RUNNER` routes jobs to the persistent box, and it
  # now does (`CI_RUNNER=tl-node-1`, set 2026-08-10). This is the precondition the
  # comment above spells out, honoured in the same change that set the variable.
  #
  # On a self-hosted runner a CANCELLED L16 sweep orphans its `next dev`
  # (turbopack) + Playwright + chrome-headless children — SIGKILL skips cleanup,
  # they run 30+ min, pin the box at load 25 and knock the runner offline. A
  # GitHub-hosted runner discards the whole VM so an orphan cannot survive; a
  # persistent machine has no such backstop.
  #
  # Cost of `false`: a rapid push series pays for every intermediate run. That is
  # now bounded by the draft guard below — pushes to a DRAFT PR start no jobs at
  # all, which is where a rapid push series actually happens.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Path filter: decide which language areas a change actually touches so we
  # don't cold-compile Rust for an apps/web-only push (and vice versa). Uses the
  # compare API — no deep checkout. FAIL-SAFE: any uncertainty (new branch,
  # cross-cutting file, API error) runs ALL areas, so the gate is never weakened,
  # only made cheaper when it safely can be.
  changes:
    # PRIVATE-MINUTE POLICY: on PUBLIC this always runs. On PRIVATE it runs
    # only for pull_request / schedule / workflow_dispatch, NOT push — a private
    # push-CI duplicates the pre-push hook (36 checks incl. all 15 guards, cargo
    # deny/audit/machete, gitleaks, evals, ruff, pytest) and the free public run.
    # pull_request is KEPT so Dependabot PRs get a real CI signal (
    # auto-merge depends on it); schedule keeps the weekly behavioral tier, which
    # is the ONLY place live-eval-gate / l16-e2e-gate / span-publish-integration /
    # ingest-release-tenant-guard can run — all four proven green together in
    # run 30687343588 (2026-08-01, full-tier workflow_dispatch on main). See:
    # a failed `changes` SKIPS all four and the run still reports a conclusion.
    # Gating these three root jobs is sufficient: every other job `needs: changes`,
    # and a skipped need skips the dependant.
    # DRAFT GUARD (2026-08-10). MEASURED: 76% of August CI minutes were pushes to
    # three open feature-branch PRs at ~45 min per push. A draft PR is
    # work-in-progress and does not need the merge gate on every push.
    # `draft` is null on non-PR events, so `!= true` leaves push / schedule /
    # workflow_dispatch untouched. Gating the ROOT jobs is sufficient: every
    # other job `needs: changes`, and a skipped need skips the dependant.
    # A run where everything skipped now reads CANNOT DETERMINE, not GREEN
    # (scripts/ops/ci-status.sh) — a draft PR is honestly unverified. Mark it
    # ready for review to get a verdict.
    if: >-
      (github.repository == 'tracelane/tracelane' || github.event_name != 'push')
      && github.event.pull_request.draft != true
    name: Detect changed areas
    runs-on: "${{ vars.CI_RUNNER || 'ubuntu-latest' }}"
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      web: ${{ steps.f.outputs.web }}
      python: ${{ steps.f.outputs.python }}
      code: ${{ steps.f.outputs.code }}
      live_stack: ${{ steps.f.outputs.live_stack }}
    steps:
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          emit() { { echo "rust=$1"; echo "web=$2"; echo "python=$3"; echo "code=$4"; echo "live_stack=$5"; } >> "$GITHUB_OUTPUT"; }
          run_all() { echo "→ running ALL areas ($1)"; emit true true true true true; exit 0; }

          if [ "$EVENT" = "pull_request" ]; then base="$BASE"
          elif [ "$EVENT" = "push" ]; then base="$BEFORE"
          else run_all "event=$EVENT"; fi
          [ -z "${base:-}" ] && run_all "no base sha"
          [ "$base" = "0000000000000000000000000000000000000000" ] && run_all "new branch / no parent"

          files=$(gh api "repos/${REPO}/compare/${base}...${SHA}" --jq '.files[].filename' 2>/dev/null) \
            || run_all "compare API failed"
          [ -z "$files" ] && run_all "empty file list"
          echo "Changed files:"; echo "$files" | sed 's/^/  /'

          rust=false; web=false; python=false; live_stack=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              # `.sql` stays cross-cutting EVERYWHERE, including under infra/prod —
              # listed first so the ops-only skip below can never swallow it.
              # infra/prod/partition-cutover.sql is the one instance today.
              infra/prod/*.sql) run_all "cross-cutting: $f";;
              # OPS-ONLY (2026-08-09, founder-ruled). Nothing under infra/prod/ is built,
              # compiled or bundled by any job here — it is prod config, systemd units,
              # Caddyfiles and deploy scripts. Before this, a ONE-FILE ClickHouse XML
              # change ran Rust, Web, evals AND a cold release-mode benchmark: ~16
              # billable minutes to benchmark code that did not change. Against a
              # 2,000-minute allowance already carrying ~400 min/mo of re-enabled
              # `guards`, that is not caution — it is noise, and noise is how a red run
              # stops being read.
              # NARROW BY DESIGN: infra/prod ONLY, never infra/*. infra/dev and
              # infra/self-host stay cross-cutting because they DO feed test stacks.
              # Enforced by scripts/ci/check-infra-prod-no-code.py, which fails if any
              # .rs/.ts/.tsx/.py appears here — turning an invisible failure mode
              # (code hiding under an excluded path) into a visible one.
              infra/prod/*) continue;;
              spec/*|infra/*|.github/*|*.sql|Makefile|justfile|.cargo/*|rust-toolchain.toml) run_all "cross-cutting: $f";;
            esac
            case "$f" in
              crates/*|Cargo.toml|Cargo.lock|packages/verifier-rust/*) rust=true;;
            esac
            # L2 live eval gate — only the gateway/ingest/span/CH/eval surface
            # needs the (expensive) ephemeral real stack. Docs/frontend PRs stay
            # mock-only, preserving the CI cost reduction.
            case "$f" in
              crates/gateway/*|crates/ingest/*|crates/shared/*|crates/policy/*|evals/*|scripts/ci/live-eval-stack.sh) live_stack=true;;
            esac
            case "$f" in
              apps/*|packages/sdk-typescript/*|packages/verifier-typescript/*|packages/cli/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|biome.json|tsconfig*|*.ts|*.tsx|*.jsx) web=true;;
            esac
            case "$f" in
              evals/*|ml/*|packages/sdk-python/*|packages/verifier-python/*|*.py|pyproject.toml|ruff.toml) python=true;;
            esac
          done <<< "$files"

          code=false
          { [ "$rust" = true ] || [ "$web" = true ] || [ "$python" = true ]; } && code=true
          echo "→ rust=$rust web=$web python=$python code=$code live_stack=$live_stack"
          emit "$rust" "$web" "$python" "$code" "$live_stack"

  # One Rust job: fmt + clippy + test share a single toolchain, checkout, and
  # cache (one rust-cache instead of the old lint/test split that cold-compiled
  # the workspace twice and fragmented the 10 GB cache budget).
  rust:
    name: Rust (fmt · clippy · test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # self-hosted tl-node-1, cgroup-HARD-guarded: runner capped 2.4 cores / 8G
    # (cpu.max + memory.max), so a runaway compile OOM-kills inside its own cgroup
    # and prod keeps a hard floor of ≥1.6 cores / ≥7G. Falls back to ubuntu-latest
    # if CI_RUNNER is unset (public repo → free hosted minutes).
    runs-on: "${{ vars.CI_RUNNER || 'ubuntu-latest' }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable 2024-12
        with:
          components: rustfmt, clippy
      - name: Cache Rust deps
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          # Share ONE debug cache across the rust / span-publish / live-eval jobs
          # (they all compile the workspace in the debug profile). Without a
          # shared-key each job wrote its own multi-GB cache → 4 caches blew the
          # 10 GB repo limit → the service 400'd and nothing persisted → perpetual
          # cold builds. One shared cache stays under the cap and actually restores.
          shared-key: "rust-ci"
      # ── (c) PERSISTENT CARGO TARGET DIR — B-202, founder-approved 2026-08-13 ──
      #
      # `actions/checkout` defaults to `clean: true` (`git clean -ffdx`), which
      # deletes the gitignored `target/` on every job. The 166 MB Swatinem cache
      # restores the registry and a pruned dep set but NOT build artifacts, so each
      # run recompiles proc-macro2 / quote / syn / serde_core — roughly 3-4 min
      # across each of the three jobs sharing the `rust-ci` key, ~12-16 min a run.
      #
      # The directory lives OUTSIDE `_work`, which is the entire trick: checkout
      # cannot reach it, so it survives.
      #
      # SELF-HOSTED ONLY. On `ubuntu-latest` the runner is ephemeral, so a
      # "persistent" directory is a lie and the path is not writable. The step is
      # SKIPPED there rather than made to look like it worked.
      #
      # THE FLOOR GUARD IS THE POINT, NOT A NICETY. This box is ONE filesystem
      # holding ClickHouse (`tracelane_clickhouse_data`), NATS and the
      # tamper-evident audit ledger. A dev `target/` here measures 54 G, so an
      # unguarded persistent target dir can consume essentially all free space on
      # the disk carrying prod data. Below the floor the dir is DELETED and the run
      # cold-builds — slow is the correct failure, full is not.
      #
      # SAFE ONLY AT CONCURRENCY=1, and that is load-bearing: these three jobs
      # share one target dir, and cargo takes a lock on it. They serialize today
      # because the runner runs one job at a time. **If a second runner is ever
      # added (B-202 option (a), currently declined), this must become per-runner
      # or it will serialize jobs that were meant to be parallel.**
      - name: Persistent cargo target dir (self-hosted only)
        if: vars.CI_RUNNER != ''
        run: |
          set -euo pipefail
          TARGET_DIR=/opt/actions-runner/cargo-target
          FLOOR_KB=$((40 * 1024 * 1024))   # 40 GiB floor on /
          avail=$(df --output=avail / | tail -1 | tr -d ' ')
          echo "disk avail=${avail} KB · floor=${FLOOR_KB} KB · target=${TARGET_DIR}"
          if [ "$avail" -lt "$FLOOR_KB" ]; then
            echo "::warning::below the 40 GiB floor — dropping ${TARGET_DIR}; this run cold-builds"
            rm -rf "$TARGET_DIR"
          fi
          mkdir -p "$TARGET_DIR"
          echo "CARGO_TARGET_DIR=${TARGET_DIR}" >> "$GITHUB_ENV"
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        # --all-targets lints test + bench code too (audit finding P2-1).
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-features

  #  regression gate: a published gateway span MUST land on the
  # TRACELANE_SPANS JetStream stream. Boots NATS with JetStream (-js) via
  # `docker run` (GitHub `services:` can't pass the -js command flag) and runs
  # the otherwise-#[ignore]d integration test. Triggered on Rust changes.
  api-key-mint-postgres:
    name: API-key mint (real Postgres)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # HOSTED on purpose: this needs a `services:` container, and the self-hosted
    # runner shares a box with production. Never point a throwaway Postgres at
    # tl-node-1.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracelane
          POSTGRES_PASSWORD: tracelane_dev
          POSTGRES_DB: tracelane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracelane"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable 2024-12
      - name: Cache Rust deps
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: "rust-ci"
      # The ONLY test that exercises `db::api_keys::create()` against a real
      # Postgres. It was `#[ignore]`d and referenced by NEITHER this workflow nor
      # verify-all.sh — zero callers, so it had never run (TRAPS §1 CLASS-1). It
      # would have gone red on its first execution: A13 bound `budget_usd_monthly`
      # as `$9::numeric` while passing an `Option<String>`, which tokio-postgres
      # refuses on EVERY call including None, so `POST /v1/keys` 500'd for two days
      # and no customer could create an API key.
      - name: api-key mint integration (real Postgres)
        env:
          POSTGRES_TEST_URL: postgres://tracelane:tracelane_dev@127.0.0.1:5432/tracelane
        run: bash scripts/ci/run-postgres-integration.sh
      # A guard ships with the proof that it BITES, in the same commit. This
      # reintroduces the exact shipped defect and requires a RED.
      - name: selftest — the suite must go RED on the reintroduced defect
        env:
          POSTGRES_TEST_URL: postgres://tracelane:tracelane_dev@127.0.0.1:5432/tracelane
        run: bash scripts/ci/run-postgres-integration.sh --selftest

  web:
    name: Web (biome · typecheck · vitest)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: "${{ vars.CI_RUNNER || 'ubuntu-latest' }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3.0.0
        with:
          # ⚠️ THIS PIN IS LOAD-BEARING FOR 18 SECURITY OVERRIDES. DO NOT BUMP IT
          # WITHOUT `scripts/ci/check-pnpm-overrides-applied.py` GREEN. (R131/R132)
          #
          # pnpm 10 STOPPED READING the `pnpm` field in package.json — which is where
          # `pnpm.overrides` lives, and every entry there is a security floor (hono,
          # postcss, qs, undici, protobufjs, brace-expansion, ip-address, …). The
          # binary on a dev box here is already 11.16.0 and prints, on every run:
          #     [WARN] The "pnpm" field in package.json is no longer read by pnpm.
          # We are safe by DELEGATION, NOT BY DESIGN: `packageManager: pnpm@9.15.0`
          # makes corepack hand off to 9.15.0, which does read it — and this pin keeps
          # CI on the same major.
          #
          # If you bump this: the overrides stop applying on the next lockfile
          # regeneration and NOTHING FAILS. No red, no alert, no advisory reappears
          # until an audit months later. Move the overrides to wherever the new pnpm
          # reads them FIRST, regenerate the lockfile, and confirm that guard is green.
          version: 9
      - name: Setup Node
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8  # v4.0.2
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build dist-based workspace deps
        # apps/web imports `@tracelanedev/audit-verifier` (ships `main: dist/…`, no
        # source-types export), so `tsc --noEmit` in apps/web cannot resolve its
        # types until the package is built. Build it before lint/typecheck/test.
        run: pnpm --filter @tracelanedev/audit-verifier build
      - name: pnpm lint (Biome)
        run: pnpm lint
      - name: pnpm typecheck
        run: pnpm typecheck
      - name: pnpm test (Vitest)
        run: pnpm test

  verifier-roundtrip:
    name: Cross-verifier round-trip (Rust · TS · Python agree — ADR-062 crown jewel)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: "${{ vars.CI_RUNNER || 'ubuntu-latest' }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3.0.0
        with:
          # ⚠️ THIS PIN IS LOAD-BEARING FOR 18 SECURITY OVERRIDES. DO NOT BUMP IT
          # WITHOUT `scripts/ci/check-pnpm-overrides-applied.py` GREEN. (R131/R132)
          #
          # pnpm 10 STOPPED READING the `pnpm` field in package.json — which is where
          # `pnpm.overrides` lives, and every entry there is a security floor (hono,
          # postcss, qs, undici, protobufjs, brace-expansion, ip-address, …). The
          # binary on a dev box here is already 11.16.0 and prints, on every run:
          #     [WARN] The "pnpm" field in package.json is no longer read by pnpm.
          # We are safe by DELEGATION, NOT BY DESIGN: `packageManager: pnpm@9.15.0`
          # makes corepack hand off to 9.15.0, which does read it — and this pin keeps
          # CI on the same major.
          #
          # If you bump this: the overrides stop applying on the next lockfile
          # regeneration and NOTHING FAILS. No red, no alert, no advisory reappears
          # until an audit months later. Move the overrides to wherever the new pnpm
          # reads them FIRST, regenerate the lockfile, and confirm that guard is green.
          version: 9
      - name: Setup Node
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8  # v4.0.2
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c  # v5.0.0
        with:
          python-version: "3.12"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable 2024-12
      - name: Cache Rust deps
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: "rust-ci"
      # Persistent cargo target dir — see the full rationale on the `rust` job.
      # Self-hosted only; 40 GiB floor on `/`; safe only at concurrency=1.
      - name: Persistent cargo target dir (self-hosted only)
        if: vars.CI_RUNNER != ''
        run: |
          set -euo pipefail
          TARGET_DIR=/opt/actions-runner/cargo-target
          FLOOR_KB=$((40 * 1024 * 1024))
          avail=$(df --output=avail / | tail -1 | tr -d ' ')
          echo "disk avail=${avail} KB · floor=${FLOOR_KB} KB · target=${TARGET_DIR}"
          if [ "$avail" -lt "$FLOOR_KB" ]; then
            echo "::warning::below the 40 GiB floor — dropping ${TARGET_DIR}; this run cold-builds"
            rm -rf "$TARGET_DIR"
          fi
          mkdir -p "$TARGET_DIR"
          echo "CARGO_TARGET_DIR=${TARGET_DIR}" >> "$GITHUB_ENV"
      - name: Install deps (JS workspace + Python verifier)
        run: |
          pnpm install --frozen-lockfile
          pip install -e packages/verifier-python/
      - name: Build TS verifier dist + Rust verifier CLI
        run: |
          pnpm --filter @tracelanedev/audit-verifier build
          cargo build --release -p tracelane-audit
      - name: Round-trip — anchored GREEN · forged-anchor REJECTED · tampered RED (all 3 verifiers)
        run: bash scripts/ci/verifier-roundtrip/run.sh

  python:
    name: Python (ruff · pytest)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: "${{ vars.CI_RUNNER || 'ubuntu-latest' }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c  # v5.0.0
        with:
          python-version: "3.12"
      - name: Install Python deps
        # Editable installs so pytest's imports resolve across evals/orchestrator,
        # verifier-python (tracelane_audit_verifier), and sdk-python (tracelane).
        run: |
          # Hash-pinned: `--require-hashes` refuses any artifact whose sha256 is
          # not listed, so a compromised or substituted wheel cannot install.
          # ruff stays PINNED EXACT inside that file — an unpinned `pip install
          # ruff` silently upgraded to 0.16.0 and broke CI with new default rules
          # (a non-reproducible linter, the green-while-broken class).
          # scripts/verify-all.sh reads the ruff pin from this same file, so the
          # local mirror cannot drift from CI. Regenerate with:
          #   uv pip compile <(printf 'ruff==<v>\npytest\npytest-asyncio\n') \
          #     --generate-hashes --python-version 3.12 \
          #     -o scripts/ci/requirements/python-ci.txt
          pip install --require-hashes -r scripts/ci/requirements/python-ci.txt
          pip install -e evals/
          pip install -e packages/verifier-python/
          pip install -e packages/sdk-python/
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: pytest
        run: pytest

  guards:
    # PRIVATE-MINUTE POLICY: on PUBLIC this always runs. On PRIVATE it runs
    # only for pull_request / schedule / workflow_dispatch, NOT push — a private
    # push-CI duplicates the pre-push hook (36 checks incl. all 15 guards, cargo
    # deny/audit/machete, gitleaks, evals, ruff, pytest) and the free public run.
    # pull_request is KEPT so Dependabot PRs get a real CI signal (
    # auto-merge depends on it); schedule keeps the weekly behavioral tier, which
    # is the ONLY place live-eval-gate / l16-e2e-gate / span-publish-integration /
    # ingest-release-tenant-guard can run — all four proven green together in
    # run 30687343588 (2026-08-01, full-tier workflow_dispatch on main). See:
    # a failed `changes` SKIPS all four and the run still reports a conclusion.
    # Gating these three root jobs is sufficient: every other job `needs: changes`,
    # and a skipped need skips the dependant.
    # PRIVATE-MINUTE POLICY AMENDED 2026-08-09 — `guards` now runs on private push too.
    #
    # The policy above justified skipping with "the free public run". Between
    # 2026-08-04 and 2026-08-09 THAT RUN DID NOT EXIST: the export dropper emitted a
    # workflow with a dangling `needs:` (added `behavioral-tier-ran` needing four
    # dropped jobs), GitHub rejected the file wholesale, and every public run produced
    # ZERO jobs with conclusion=failure. Combined with 14/14 skipped here, there was no
    # executing CI anywhere for five days — and the only surviving control,
    # .githooks/pre-push, is bypassable with --no-verify and skipped entirely by a
    # GitHub-UI merge.
    #
    # COST, measured not guessed: `guards` runs 11-18s (median 17s) => 1 billable
    # minute, and there were 400 push-event runs in the last 30 days (all to main).
    # ~400 min/month, 20% of the 2,000-minute Free allowance. `guards` is a LEAF job —
    # nothing `needs:` it — so this re-enables exactly one job and cannot cascade.
    # `changes` stays gated (every expensive job needs it) and so does `secret-scan`
    # (its gitleaks scan already runs in verify-all.sh:218).
    #
    # To revert: restore
    #   if: github.repository == 'tracelane/tracelane' || github.event_name != 'push'
    # A5 keeps `guards` on private push. The DRAFT exclusion is additive and does
    # not touch that: without it a draft run would be `guards` green + everything
    # else skipped, which ci-status would read as GREEN — the false-verdict shape.
    if: github.event.pull_request.draft != true
    name: Repo guards (20 structural checks)
    # ROUTED TO THE SELF-HOSTED RUNNER 2026-08-17 (founder: "run locally as in the
    # past, I won't add money for now"). This job was the ONLY hardcoded
    # `ubuntu-latest` that runs on a private PUSH, and hosted minutes are exhausted,
    # so it failed to PROVISION on seven consecutive pushes — 0 steps in 2 seconds,
    # no log blob, while the last green run executed 52 steps. Nothing was wrong with
    # the guards: all 20 pass locally. A job that never starts reports `failure`
    # exactly like a job that fails, which is why the streak went unnoticed.
    #
    # Safe on the shared box: these are 20 python/shell structural checks, and the
    # runner's systemd unit is already cgroup-capped (CPUQuotaPerSecUSec=2.4s of 4
    # cores, MemoryMax=8G), the same mitigation that let rust/web/python route here.
    #
    # The other three hardcoded jobs STAY hosted, deliberately: `api-key-mint-postgres`
    # needs a `services:` container and must never point a throwaway Postgres at the
    # production node; `live-eval-gate` and `bench` run on schedule/dispatch only and
    # were never part of this failure.
    runs-on: "${{ vars.CI_RUNNER || 'ubuntu-latest' }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # check-promotion-readiness.py --selftest exercises `--pass-scope DELTA from
          # an older commit`, which needs real history: it resolves HEAD~3 and diffs
          # the docs that changed since. At the default fetch-depth 1 that commit does
          # not exist, the case cannot run, and the assertion enforced NOTHING here —
          # the guard-that-never-blocked shape this very file exists to prevent. 10 is
          # the smallest depth that satisfies the HEAD~3 lookup with margin.
          fetch-depth: 10

      - name: SPIFFE auth stub regression guard (ADR-028)
        if: ${{ !cancelled() }}
        run: ./scripts/ci/no-auth-stub.sh

      - name: ClickHouse query cap-wrapper guard (ADR-031)
        if: ${{ !cancelled() }}
        run: ./scripts/ci/no-raw-ch-query.sh

      - name: Gateway-URL fallback guard (no silent localhost → CF 1003)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-no-localhost-gateway-fallback.py

      # R84 / TRAPS §43 — the Dependabot vector. This job is python/shell only and
      # runs on the self-hosted runner, which has NO cargo; the sibling guard
      # (check-build-script-network-deps.py) shells `cargo metadata` and fails
      # CLOSED without it, so putting THAT one here would turn the only working CI
      # job permanently red. This guard needs no toolchain: it reads dependency
      # metadata from the crates.io sparse index. Metadata only — it never
      # downloads, unpacks or executes the crate.
      - name: New-crate build deps — selftest (prove the check bites)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-new-crate-build-deps.py --selftest

      - name: New-crate build deps (a Dependabot bump is the B-263 vector)
        if: ${{ !cancelled() }}
        run: |
          # The fetch may fail on a network blip; the GUARD decides, not the fetch.
          # If the base is genuinely absent it exits 2 (CANNOT DETERMINE) and this
          # job goes red — which is correct: an unread delta is not a clean delta.
          git fetch --no-tags --depth=50 origin main || true
          python3 scripts/ci/check-new-crate-build-deps.py --base origin/main

      - name: Docs site guard — selftest (prove the checks bite)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-docs-site.py --selftest

      - name: Docs site guard (nav 404s · missing logo · MDX parse · dead links)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-docs-site.py

      - name: Provider mapping single-source guard
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-provider-mapping-single-source.py

      - name: Tenant Isolation (ClickHouse SQL guard)
        if: ${{ !cancelled() }}
        # --selftest FIRST: it plants violations (incl. an unscoped query beside
        # a scoped one in the same file — the case the pre-2026-08-03 whole-file
        # guard could not catch) and asserts the guard reports them. A guard that
        # has never been observed blocking is not a guard, so the falsification
        # runs on every CI run, not once at authoring time. Same step = no extra
        # billable job-minute.
        run: |
          python3 scripts/ci/check-tenant-isolation.py --selftest
          python3 scripts/ci/check-tenant-isolation.py

      - name: pre-public-push guard parity
        if: ${{ !cancelled() }}
        # The root guard and the export guard are separate
        # implementations; patching one does nothing to what ships. Selftest
        # first (both halves), then the real parity check. Existing job — no
        # extra billable job-minute.
        run: |
          python3 scripts/ci/check-guard-parity.py --selftest
          python3 scripts/ci/check-guard-parity.py

      # node is NOT preinstalled on the self-hosted runner. This job inherited it
      # free from ubuntu-latest, so routing to tl-node-1 made the ONE node step below
      # fail with `node: command not found` while the other 51 python/shell steps
      # passed. Same pinned action and version the web/verifier jobs already use; no
      # `cache: pnpm` because this job installs no dependencies.
      - name: Set up Node (the one node-dependent guard below)
        if: ${{ !cancelled() }}
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8  # v4.0.2
        with:
          node-version: 22

      - name: Benchmark 2xx-gate selftest
        if: ${{ !cancelled() }}
        # Both halves. The previous gate was only tested for BLOCKING a bad run
        # and shipped unable to PASS a good one (it read metrics[n].count where
        # every k6 version puts metrics[n].values.count), so it refused valid
        # runs too — a wall, not a gate. The PASS half is the half that catches
        # that. Runs against real captured k6 payloads in bench/gateway/testdata.
        # Added to an existing job: no extra billable job-minute.
        run: node bench/gateway/summary-gate.selftest.mjs

      - name: org_id→tenant-UUID provenance guard
        if: ${{ !cancelled() }}
        run: ./scripts/ci/check-tenant-id-provenance.sh

      - name: tenants PK is `id` not `tenant_id` (old-shape SQL guard)
        if: ${{ !cancelled() }}
        run: ./scripts/ci/check-tenants-pk-column.sh

      - name: Token-free recovery guard (ADR-037)
        if: ${{ !cancelled() }}
        run: ./scripts/ci/no-llm-in-recovery.sh

      - name: Span-before-guardrail ordering guard (#81 span-drop)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-span-publish-ordering.py

      - name: GenAI attribute-key guard (ADR-043)
        if: ${{ !cancelled() }}
        run: ./scripts/ci/check-genai-attr-keys.sh

      - name: E2E auth-bypass flag confinement guard
        if: ${{ !cancelled() }}
        run: ./scripts/ci/no-e2e-auth-in-prod.sh

      - name: Action SHA-pin guard — selftest (prove it bites)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-action-sha-pins.py --selftest

      - name: Action SHA-pin guard (no tag-pinned `uses:`)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-action-sha-pins.py

      - name: Workflow job-graph guard — selftest (prove a dangling need bites)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-workflow-job-graph.py --selftest

      # A `needs:` naming a job that does not exist makes GitHub reject the WHOLE
      # workflow: zero jobs start, so there is no failing step to read and the run is
      # indistinguishable from an ordinary red one. That is how the public repo ran
      # dead for five days (2026-08-04 → 08-09). build-public-export.sh runs this same
      # guard on its OWN output, so the transform can no longer ship a broken graph.
      - name: Workflow job-graph guard (no dangling `needs:`)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-workflow-job-graph.py

      - name: Hot-path logging guard — selftest
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-hot-path-logging.py --selftest

      # No info! on a per-request path — repetition belongs in a counter.
      - name: Hot-path logging policy (no per-request INFO)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-hot-path-logging.py

      - name: R2 endpoint jurisdiction guard — selftest
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-r2-endpoint-jurisdiction.py --selftest

      # R2 endpoints are jurisdiction-scoped; the default host AccessDenies our EU bucket.
      - name: R2 endpoint carries the .eu. jurisdiction segment
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-r2-endpoint-jurisdiction.py

      - name: infra/prod no-code guard — selftest
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-infra-prod-no-code.py --selftest

      # The condition on excluding infra/prod/** from path-filtering.
      - name: infra/prod contains no built-language source
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-infra-prod-no-code.py

      - name: Suppression review-date guard — selftest
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-suppression-reviews.py --selftest

      # A vulnerability suppression with no review date is permanent by default.
      - name: Suppression review dates (no undated or expired suppressions)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-suppression-reviews.py

      - name: Alert-metric single-source guard — selftest
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-alert-metrics-single-source.py --selftest

      # The alertable-metric list is written in 6 places. overhead_p99 was accepted by
      # the Postgres CHECK and the gateway but 422'd by the web proxy, so migration 0017
      # was unreachable from the dashboard and nothing failed.
      - name: Alert-metric single-source guard (6 layers must agree)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-alert-metrics-single-source.py

      - name: API-key scope single-source guard — selftest
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-api-scope-single-source.py --selftest

      # GWY-41. The scope vocabulary is written in 3 places: the Rust enum that
      # decides, the mint dialog's checkbox list, and the api_keys.scope column
      # comment. A scope in Rust but not the UI is a capability nobody can grant;
      # a checkbox for a slug Rust refuses mints a key with LESS access than the
      # dialog just promised.
      - name: API-key scope single-source guard (3 layers must agree)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-api-scope-single-source.py

      - name: Guard meta-gate — selftest (prove the meta-gate itself blocks)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-guard-selftests.py --selftest

      # THE META-GATE. Asserts every scripts/** guard verify-all.sh invokes can prove it
      # blocks: it must reject an unknown flag AND pass its own --selftest. 20 scripts
      # silently accepted `--selftest` and exited 0 having proven nothing; the unknown-flag
      # probe is what makes a selftest pass mean anything at all.
      - name: Guard selftest meta-gate (every guard can prove it blocks)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-guard-selftests.py

      - name: Workflow job-graph guard (no dangling `needs:`)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-workflow-job-graph.py

      - name: Dockerfile digest-pin guard — selftest (prove it bites)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-dockerfile-digest-pins.py --selftest

      - name: Dockerfile digest-pin guard (no FROM without @sha256:)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-dockerfile-digest-pins.py

  # Fast per-push secret + supply-chain gate. Secret detection is the one scan
  # where push-time matters (especially ahead of the public extraction, ).
  # The slow Rust vuln scans (cargo-audit, cargo-deny, grype, osv) stay nightly
  # in security-scan.yml. Always-on; ~1 min.
  secret-scan:
    # PRIVATE-MINUTE POLICY: on PUBLIC this always runs. On PRIVATE it runs
    # only for pull_request / schedule / workflow_dispatch, NOT push — a private
    # push-CI duplicates the pre-push hook (36 checks incl. all 15 guards, cargo
    # deny/audit/machete, gitleaks, evals, ruff, pytest) and the free public run.
    # pull_request is KEPT so Dependabot PRs get a real CI signal (
    # auto-merge depends on it); schedule keeps the weekly behavioral tier, which
    # is the ONLY place live-eval-gate / l16-e2e-gate / span-publish-integration /
    # ingest-release-tenant-guard can run — all four proven green together in
    # run 30687343588 (2026-08-01, full-tier workflow_dispatch on main). See:
    # a failed `changes` SKIPS all four and the run still reports a conclusion.
    # Gating these three root jobs is sufficient: every other job `needs: changes`,
    # and a skipped need skips the dependant.
    # DRAFT GUARD (2026-08-10). MEASURED: 76% of August CI minutes were pushes to
    # three open feature-branch PRs at ~45 min per push. A draft PR is
    # work-in-progress and does not need the merge gate on every push.
    # `draft` is null on non-PR events, so `!= true` leaves push / schedule /
    # workflow_dispatch untouched. Gating the ROOT jobs is sufficient: every
    # other job `needs: changes`, and a skipped need skips the dependant.
    # A run where everything skipped now reads CANNOT DETERMINE, not GREEN
    # (scripts/ops/ci-status.sh) — a draft PR is honestly unverified. Mark it
    # ready for review to get a verdict.
    if: >-
      (github.repository == 'tracelane/tracelane' || github.event_name != 'push')
      && github.event.pull_request.draft != true
    name: Secret + supply-chain scan (fast)
    runs-on: "${{ vars.CI_RUNNER || 'ubuntu-latest' }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # gitleaks runs FIRST, on the pristine checkout (no node_modules/target
      # present yet), so it stays ~3s and false-positive-free.
      - name: Install gitleaks
        # Extract to $RUNNER_TEMP (always runner-writable) — NOT /usr/local/bin,
        # which the self-hosted runner user can't write (it only worked on the
        # ephemeral ubuntu-latest VM where the runner had sudo).
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Gitleaks secret scan
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --config .gitleaks.toml
      - name: .pth file scan (ML supply chain)
        run: |
          if find . -name "*.pth" -not -path "./node_modules/*" -not -path "./.git/*" | grep -q .; then
            echo "ERROR: .pth files found — potential ML model backdoor"
            find . -name "*.pth" -not -path "./node_modules/*" -not -path "./.git/*"
            exit 1
          fi
          echo ".pth scan: clean"
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3.0.0
        with:
          # ⚠️ THIS PIN IS LOAD-BEARING FOR 18 SECURITY OVERRIDES. DO NOT BUMP IT
          # WITHOUT `scripts/ci/check-pnpm-overrides-applied.py` GREEN. (R131/R132)
          #
          # pnpm 10 STOPPED READING the `pnpm` field in package.json — which is where
          # `pnpm.overrides` lives, and every entry there is a security floor (hono,
          # postcss, qs, undici, protobufjs, brace-expansion, ip-address, …). The
          # binary on a dev box here is already 11.16.0 and prints, on every run:
          #     [WARN] The "pnpm" field in package.json is no longer read by pnpm.
          # We are safe by DELEGATION, NOT BY DESIGN: `packageManager: pnpm@9.15.0`
          # makes corepack hand off to 9.15.0, which does read it — and this pin keeps
          # CI on the same major.
          #
          # If you bump this: the overrides stop applying on the next lockfile
          # regeneration and NOTHING FAILS. No red, no alert, no advisory reappears
          # until an audit months later. Move the overrides to wherever the new pnpm
          # reads them FIRST, regenerate the lockfile, and confirm that guard is green.
          version: 9
      - name: Setup Node
        # No pnpm cache here: `pnpm audit` reads pnpm-lock.yaml (no install,
        # no node_modules), so the cache adds nothing — and dropping it removes
        # the cache-save post-step that can fail the job during a GitHub
        # cache-service outage.
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8  # v4.0.2
        with:
          node-version: 22
      - name: pnpm audit (high severity)
        run: pnpm audit --audit-level=high

  bench:
    name: Benchmarks (gateway + ingest hot path)
    needs: changes
    # Auto-run whenever the perf-sensitive surface (gateway/ingest/shared/policy)
    # changed — no manual 'hot-path' label needed (the label gate meant bench
    # almost never ran). On nightly/dispatch the `changes` job fail-safes to
    # all-true, so the perf budgets are enforced every night regardless of paths.
    # The dedicated self-hosted box also yields STABLE criterion numbers (vs the
    # noisy shared GitHub runners), which is what makes `bench:budgets` meaningful.
    #
    # Bench is the ~20-min long pole. Run it exactly where the-class perf
    # gate is needed — a PR-to-main touching the hot path (`live_stack`, which the
    # `changes` filter sets for crates/gateway|ingest|shared|policy) + the WEEKLY
    # cron + manual dispatch — but NOT on the post-merge main `push` (redundant
    # with the PR run that already gated the merge). `!= push` keeps it off the
    # main-push event while `live_stack` keeps it on hot-path PRs.
    # NOTE: a DIRECT-to-main hot-path push (no PR) therefore skips bench until the
    # weekly cron — route hot-path changes through a PR to get the bench gate.
    # 2026-08-10: OFF pull_request too. A release-profile benchmark has no business
    # on an intermediate push — 441 min in August, the single largest job.
    # TRADE, stated plainly: a hot-path PR no longer gets the perf gate before
    # merge; a regression is caught by the WEEKLY cron instead. When a PR needs the
    # gate, run it deliberately: gh workflow run CI --ref <branch>.
    if: >-
      needs.changes.outputs.live_stack == 'true'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest  # HEAVY (cargo/stack): OFF the prod node (per-job routing; ubuntu-latest is billing-gated - the founder's separate concern)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable 2024-12
      - name: Cache Rust deps
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          # Bench compiles in the RELEASE profile — a distinct target dir from the
          # debug jobs, so it gets its own shared cache (mixing profiles under one
          # key thrashes the hit rate). 2 caches total (rust-ci + rust-bench),
          # both under the 10 GB cap.
          shared-key: "rust-bench"
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3.0.0
        with:
          # ⚠️ THIS PIN IS LOAD-BEARING FOR 18 SECURITY OVERRIDES. DO NOT BUMP IT
          # WITHOUT `scripts/ci/check-pnpm-overrides-applied.py` GREEN. (R131/R132)
          #
          # pnpm 10 STOPPED READING the `pnpm` field in package.json — which is where
          # `pnpm.overrides` lives, and every entry there is a security floor (hono,
          # postcss, qs, undici, protobufjs, brace-expansion, ip-address, …). The
          # binary on a dev box here is already 11.16.0 and prints, on every run:
          #     [WARN] The "pnpm" field in package.json is no longer read by pnpm.
          # We are safe by DELEGATION, NOT BY DESIGN: `packageManager: pnpm@9.15.0`
          # makes corepack hand off to 9.15.0, which does read it — and this pin keeps
          # CI on the same major.
          #
          # If you bump this: the overrides stop applying on the next lockfile
          # regeneration and NOTHING FAILS. No red, no alert, no advisory reappears
          # until an audit months later. Move the overrides to wherever the new pnpm
          # reads them FIRST, regenerate the lockfile, and confirm that guard is green.
          version: 9
      - name: Setup Node
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8  # v4.0.2
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run hot-path benchmarks (gateway + ingest criterion)
        run: |
          pnpm bench:gateway
          pnpm bench:ingest
      - name: Enforce performance budgets (punchlist #5)
        run: pnpm bench:budgets

  # ──: THE TIER'S ABSENCE MUST NOT READ AS SUCCESS ───────────────────────
  # After turned private push-CI off, the weekly cron is the ONLY home for
  # live-eval-gate / l16-e2e-gate / span-publish-integration /
  # ingest-release-tenant-guard. Measured across every cron firing to date, the
  # tier executed in exactly ONE of four:
  #   28732121265 (2026-07-05) ✅ all four ran, green
  #   29181743552 (2026-07-12) `changes` FAILED → all four SKIPPED; run still reported a conclusion
  #   29675298614 (2026-07-19) cancelled
  #   30190109992 (2026-07-26) `changes` FAILED → all four SKIPPED; run still reported a conclusion
  # ~25% coverage while the board reads "weekly behavioral net". "Ever green"
  # passes on a technicality; the protection does not hold.
  #
  # A skipped `needs:` skips the dependant. The private-minute policy relies on
  # that deliberately (see the `changes` job condition) — and it is the same
  # mechanism that makes the tier vanish without a mark. Both cron failures were
  # INFRASTRUCTURAL: every cheap guard failed too, so the run read as generally
  # broken and the one thing that went missing was invisible inside the noise.
  # Hence this job NAMES which of the four did not run and WHY, rather than only
  # failing — a red run that does not say what is absent reproduces the defect.
  #
  # Cost: one job on schedule + dispatch ≈ 5 billable min/month (GitHub rounds
  # every job up to a whole minute, so cost is job COUNT).
